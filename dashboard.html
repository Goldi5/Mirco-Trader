<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📊 Micro-Trader</title>
<style>
:root {
  /* ── NEUES DESIGN-SYSTEM: Calm Trading Command Center ── */
  --bg: #f7f9fc;
  --surface: #ffffff;
  --surface-muted: #f1f4f8;
  --border: #e5eaf0;
  --text: #0f172a;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;

  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-soft: #eff6ff;

  --success: #059669;
  --success-soft: #ecfdf5;
  --warning: #d97706;
  --warning-soft: #fffbeb;
  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --purple: #7c3aed;
  --purple-soft: #f5f3ff;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;

  --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
  --shadow-md: 0 4px 12px rgba(15,23,42,.08);
  --shadow-lg: 0 12px 32px rgba(15,23,42,.12);

  /* ── ALIAS (Bestandskompatibilität — 498 Inline-Styles nutzen diese Namen) ── */
  --bg1: #f7f9fc;
  --bg2: #eef2f7;
  --card-bg: #ffffff;
  --card-border: #e5eaf0;
  --card-hover: #f1f4f8;
  --glass-strong: #ffffff;
  --edge: #ffffff;
  --edge2: #e5eaf0;
  --accent: #2563eb;
  --accent-soft: #eff6ff;
  --accent-dark: #1d4ed8;
  --green: #059669;
  --amber: #d97706;
  --red: #dc2626;
  --purple: #7c3aed;
  --text-dim: #64748b;
  --text2: #64748b;
  --text3: #94a3b8;
  --radius: 12px;
  --r-lg: 16px;
  --r-sm: 8px;
  --shadow: 0 1px 2px rgba(15,23,42,.04);
  --shadow-lg: 0 12px 32px rgba(15,23,42,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter','Segoe UI Variable','Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:var(--bg);
  color:var(--text);
  padding:0;
  min-height:100vh;
  font-variant-numeric:tabular-nums;
}
.num,td,th{font-variant-numeric:tabular-nums}
h1{font-size:27px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:6px}
h1 span{font-size:12px;font-weight:400;color:var(--text-secondary)}
h2{font-size:17px;font-weight:700;letter-spacing:-0.2px}
h3{font-size:14px;font-weight:600}

/* ── DUNKLER, KOMPAKTER HEADER (neu) ── */
.app-header{
  position:sticky;top:0;z-index:100;
  background:#0f172a;color:#f8fafc;
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:0 24px;
}
.app-header-inner{
  max-width:1440px;margin:0 auto;
  display:flex;align-items:center;gap:20px;height:56px;
}
.app-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.app-logo img{width:30px;height:30px;border-radius:8px}
.app-logo .app-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-0.2px}
.app-logo .app-sub{font-size:10px;color:#94a3b8;line-height:1}
.app-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mode-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 12px;border-radius:var(--radius-pill);
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.mode-pill.shadow{background:rgba(217,119,6,.18);color:#fbbf24}
.mode-pill.paper{background:rgba(5,150,105,.2);color:#34d399}
.mode-pill.live{background:rgba(220,38,38,.2);color:#f87171}
.market-chip{font-size:11px;color:#cbd5e1;white-space:nowrap}
.market-chip b{font-weight:600}
.hdr-time{font-size:11px;color:#94a3b8;white-space:nowrap}

/* ── TOP-NAVIGATION (8 Bereiche, neu) ── */
.topnav{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.nav-item{
  padding:6px 8px;border-radius:8px;font-size:12.5px;font-weight:500;
  color:#cbd5e1;text-decoration:none;white-space:nowrap;cursor:pointer;
  border:none;background:transparent;font-family:inherit;
  transition:background .15s,color .15s;
}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-item.active{color:#fff;background:var(--primary);font-weight:600}
.nav-item .nav-icon{font-size:13px;margin-right:5px}
.hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0;min-width:0}
.hdr-right #versionBadge{max-width:120px;overflow:hidden;text-overflow:ellipsis}

/* ── SUB-NAV (Portfolios/Analyse-Unterbereiche) ── */
.subnav-wrap{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;display:none;
}
.subnav-wrap.active{display:block}
.subnav-inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:4px;height:44px}
.subnav-item{
  padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:500;
  color:var(--text-secondary);cursor:pointer;border:none;background:transparent;font-family:inherit;
  transition:background .15s,color .15s;
}
.subnav-item:hover{color:var(--text);background:var(--surface-muted)}
.subnav-item.active{color:var(--primary);background:var(--primary-soft);font-weight:600}

/* ── SEARCH (Header) ── */
.hdr-search{position:relative;flex-shrink:0}
.hdr-search input{
  width:130px;padding:7px 12px 7px 30px;border-radius:8px;
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);
  color:#fff;font-size:12.5px;font-family:inherit;outline:none;
  transition:border-color .15s,width .2s;
}
.hdr-search input::placeholder{color:#94a3b8}
.hdr-search input:focus{border-color:var(--primary);width:170px}
.hdr-search .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.7;pointer-events:none}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:200;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg);max-height:320px;overflow-y:auto;display:none;
}
.search-results.active{display:block}
.search-results .sr-item{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text)}
.search-results .sr-item:last-child{border:none}
.search-results .sr-item:hover{background:var(--surface-muted)}

/* ── USER-MENU ── */
.hdr-user{
  display:flex;align-items:center;gap:9px;cursor:pointer;
  padding:5px 10px;border-radius:10px;transition:background .15s;position:relative;
  color:#f8fafc;
}
.hdr-user:hover{background:rgba(255,255,255,.08)}
.hdr-user .u-avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;flex-shrink:0;
}
.hdr-user .u-name{font-size:12px;font-weight:600;color:#fff;line-height:1.2}
.hdr-user .u-role{font-size:9.5px;color:#94a3b8;line-height:1.2}
.user-menu{
  display:none;position:absolute;right:0;top:calc(100% + 10px);min-width:230px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);padding:8px;z-index:300;
}
.user-menu.open{display:block}
.user-menu .um-head{padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.user-menu .um-head .n{font-size:13px;font-weight:700;color:var(--text)}
.user-menu .um-head .r{font-size:10.5px;color:var(--text-secondary)}
.user-menu .um-head .m{font-size:10px;color:var(--text-muted);margin-top:2px}
.um-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
  cursor:pointer;font-size:12.5px;color:var(--text);transition:background .12s;
}
.um-item:hover{background:var(--surface-muted)}
.um-item.danger{color:var(--danger)}
.um-item.danger:hover{background:var(--danger-soft)}
.um-sep{border-top:1px solid var(--border);margin:6px 0}

/* ── LAYOUT ── */
.main-wrap{max-width:1440px;margin:0 auto;padding:24px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── PANELS ── */
.panel{display:none;animation:fadeIn 0.25s ease}
.panel.active{display:block}

/* ── HERO (Startseite) ── */
.hero{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:28px 32px;margin-bottom:20px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;
}
.hero .hero-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.hero .hero-value{font-size:44px;font-weight:700;letter-spacing:-1.2px;color:var(--text);line-height:1.1}
.hero .hero-sub{display:flex;gap:16px;margin-top:10px;font-size:13.5px;flex-wrap:wrap}
.hero .hero-sub .hl{font-size:11px;color:var(--text-muted)}
.hero .hero-meta{font-size:11.5px;color:var(--text-muted);margin-top:12px}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:200px}
.hero-right .hr-badge{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;justify-content:flex-end}
.hero-right .hr-badge b{font-weight:600}

/* ── KPI-GRID (max 4) ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:18px 20px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;
}
.kpi-card:hover{border-color:#c9d4e3;box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kpi-card .kpi-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi-card .kpi-value{font-size:26px;font-weight:700;letter-spacing:-0.6px;color:var(--text)}
.kpi-card .kpi-change{font-size:13px;font-weight:600;margin-top:3px}
.kpi-card .kpi-meta{font-size:11px;color:var(--text-muted);margin-top:5px}

/* ── ZWEI-SPALTIG (Chart | Aktivität) ── */
.main-grid{display:grid;grid-template-columns:8fr 4fr;gap:16px;margin-bottom:20px}
.surface{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:22px 24px;
}
.surface h3{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.surface h3 .h3-sub{font-size:11px;font-weight:500;color:var(--text-muted)}

/* ── TIMELINE (Aktivität) ── */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.tl-item:last-child{border-bottom:none}
.tl-item .tl-time{font-size:11px;color:var(--text-muted);flex-shrink:0;width:42px;padding-top:1px}
.tl-item .tl-ico{flex-shrink:0;width:22px;text-align:center}
.tl-item .tl-txt{color:var(--text);line-height:1.35}
.tl-item .tl-txt b{font-weight:600}
.tl-more{margin-top:10px;text-align:center}
.tl-more a{font-size:12px;font-weight:600;color:var(--primary);text-decoration:none}
.tl-more a:hover{text-decoration:underline}

/* ── UNTERER BEREICH (Risiko | KI-Status) ── */
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.mini-stat{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.mini-stat:last-child{border-bottom:none}
.mini-stat .ms-label{color:var(--text-secondary)}
.mini-stat .ms-val{font-weight:600;color:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot.g{background:var(--success)}.dot.y{background:var(--warning)}.dot.r{background:var(--danger)}.dot.b{background:var(--primary)}

/* ── GLAS-KLASSEN → opake Flächen (Bestandskompatibilität) ── */
.glass{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:14px;
  margin-bottom:12px;
  transition:border-color .15s,box-shadow .15s;
  position:relative;
}
.glass:hover{border-color:#c9d4e3;box-shadow:var(--shadow-sm)}
.glass::after{display:none}

/* ── GRID / CARDS ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:14px;
  cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .15s;
}
.card:hover{border-color:#c9d4e3;box-shadow:var(--shadow-md);transform:translateY(-1px)}
.card.positive{border-left:3px solid var(--success)}
.card.negative{border-left:3px solid var(--danger)}
.card.neutral{border-left:3px solid var(--border)}
.card h3{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.card .wert{font-size:21px;font-weight:700;letter-spacing:-0.5px;color:var(--text)}
.card .rendite{font-size:13px;font-weight:600;margin-top:2px}
.card .meta{font-size:11px;color:var(--text-muted);margin-top:5px}
.positiv{color:var(--success)}.negativ{color:var(--danger)}

/* ── SECTOR-BADGES (Pastell → Soft-Flächen, kräftiger Text) ── */
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px;margin:1px 2px 0 0;letter-spacing:.02em;white-space:nowrap}
.badge-tech{background:var(--primary-soft);color:var(--primary)}
.badge-healthcare{background:var(--success-soft);color:#16a34a}
.badge-finance{background:var(--warning-soft);color:#b45309}
.badge-energy{background:#ffedd5;color:#c2410c}
.badge-utilities{background:#eef2ff;color:#4f46e5}
.badge-realestate{background:var(--purple-soft);color:var(--purple)}
.badge-consumer-defensive{background:#fdf2f8;color:#be185d}
.badge-consumer-cyclical{background:#fff7ed;color:#ea580c}
.badge-industrials{background:#e0f2fe;color:#0284c7}
.badge-basic-materials{background:#f0fdf4;color:#65a30d}
.badge-communication{background:#fae8ff;color:#a21caf}
.badge-technology{background:var(--primary-soft);color:var(--primary)}
.badge-biotech{background:#ccfbf1;color:#0d9488}
.badge-crypto{background:#fef9c3;color:#a16207}
.badge-meme{background:var(--danger-soft);color:var(--danger)}
.badge-inverse{background:#f4f4f5;color:#52525b}
.badge-lev-bull{background:#dcfce7;color:#15803d}
.badge-lev-bear{background:var(--danger-soft);color:#b91c1c}
.badge-volatility{background:#ffedd5;color:#c2410c}
.badge-commodity{background:var(--warning-soft);color:#a16207}
.badge-ai{background:#eef2ff;color:#4338ca}
.badge-ev{background:#d1fae5;color:#047857}
.badge-space{background:#e0f2fe;color:#0369a1}
.badge-warn{background:var(--warning-soft);color:var(--warning)}
.badge-error{background:var(--danger-soft);color:var(--danger)}

/* ── TABELLEN ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--text-secondary);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--surface-muted)}
.ranking-tbl td,.ranking-tbl th{padding:6px 10px}

/* ── STATS / SUMMARY ── */
.summary-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:12px 18px;
  min-width:90px;
}
.stat .num{font-size:22px;font-weight:700;letter-spacing:-0.4px;color:var(--text)}
.stat .lbl{font-size:10.5px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/* ── PROGRESS / MOVER / NEWS / KI ── */
.mover{padding:3px 0;font-size:12.5px;display:flex;justify-content:space-between}
.mover .tik{font-weight:600}
.mover .chg{font-weight:600}
.news-list{max-height:520px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.news-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:11px 14px;
  font-size:13px;
  transition:border-color .15s;
}
.news-item:hover{border-color:#c9d4e3}
.news-item .title{color:var(--text);font-weight:500}
.news-item .topics{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.news-item .topic{background:var(--primary-soft);color:var(--primary);padding:2px 9px;border-radius:var(--radius-pill);font-size:10px;font-weight:600}
.news-item .age-new{color:var(--success);font-size:10px;font-weight:600}
.news-item .age-now{color:var(--primary);font-size:10px;font-weight:500}
.news-item .age-old{color:var(--text-muted);font-size:10px}
.news-item .ki-score{color:var(--text-muted);letter-spacing:-1px}
.ki-table{width:100%;border-collapse:collapse;font-size:12px}
.ki-table th{text-align:left;padding:6px 8px;color:var(--text-secondary);font-weight:600;border-bottom:1px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.ki-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
.ki-table tr:hover{background:var(--surface-muted)}
.ki-table .title-col{max-width:350px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ki-score-badge{background:var(--primary-soft);padding:2px 8px;border-radius:var(--radius-pill);font-size:10px;font-weight:600}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;border-radius:var(--radius-sm);border:none;cursor:pointer;
  font-size:13px;font-weight:600;font-family:inherit;text-decoration:none;
  transition:background .15s,color .15s,border-color .15s;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--surface-muted)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.back-btn{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 16px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  font-size:13px;
  font-family:inherit;
  transition:background .15s;
  margin-bottom:12px;
  display:inline-block;
}
.back-btn:hover{background:var(--surface-muted)}

/* ── ZWEI-SPALTEN (Bestand) ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}

/* ── DETAIL-HEADER ── */
.detail-header{margin-bottom:12px}
.detail-header h2{font-size:17px;font-weight:700}
.detail-header .sub{font-size:12px;color:var(--text-secondary);margin-top:2px}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(15,23,42,.14);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(15,23,42,.25)}

/* ── CHARTS ── */
.chart-wrap{border-radius:var(--radius-md)}
canvas{display:block;max-width:100%}
#panel-charts .glass{max-height:280px;overflow:hidden}
#panel-charts canvas{max-height:240px}
#panel-overview .glass canvas{max-height:220px}

/* ── PROFILE-KARTEN ── */
#profil-karten{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.profil-karte{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 14px;min-width:120px;box-shadow:none;
}
.profil-karte.shadow{border-left:3px solid var(--warning)}
.profil-karte.live{border-left:3px solid var(--success)}
.profil-karte .pk-markt{font-size:10px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em}
.profil-karte .pk-name{font-size:13px;font-weight:600;color:var(--text);margin:2px 0}
.profil-karte .pk-badge{font-size:10px;font-weight:600;margin:2px 0}
.profil-karte.shadow .pk-badge{color:var(--warning)}
.profil-karte.live .pk-badge{color:var(--success)}
.profil-karte .pk-info{font-size:10px;color:var(--text-muted)}

/* ── DRAWER (Phase 5) ── */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:500;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;z-index:501;
  background:var(--surface);box-shadow:var(--shadow-lg);
  transform:translateX(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
  border-radius:var(--radius-lg) 0 0 var(--radius-lg);
}
.drawer.open{transform:translateX(0)}
.drawer-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;border-bottom:1px solid var(--border);
}
.drawer-header h2{font-size:17px;font-weight:700}
.drawer-close{
  width:32px;height:32px;border-radius:8px;border:none;background:var(--surface-muted);
  color:var(--text-secondary);font-size:15px;cursor:pointer;font-family:inherit;
  transition:background .15s,color .15s;
}
.drawer-close:hover{background:var(--border);color:var(--text)}
.drawer-body{flex:1;overflow-y:auto;padding:20px 22px}
.drawer-section{border-bottom:1px solid var(--border);padding:14px 0}
.drawer-section:last-child{border-bottom:none}
.drawer-section h4{font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.drawer-actions{display:flex;gap:8px;padding:16px 22px;border-top:1px solid var(--border)}

/* ── RESPONSIVE (Phase 11-Grundlage) ── */
@media(max-width:1200px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .main-grid{grid-template-columns:1fr}
  .hdr-search input{width:150px}
}
@media(max-width:1024px){
  .app-header-inner{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}
  .topnav{order:3;width:100%}

}
@media(max-width:768px){
  .main-wrap{padding:16px}
  .hero{padding:20px;flex-direction:column}
  .hero .hero-value{font-size:34px}
  .hero-right{align-items:flex-start}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px}

  .drawer{width:100%;border-radius:0}

}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr}

}

@media(prefers-reduced-motion:reduce){

<script>
const API = "/data";
let detChart = null;
let savedData = null;
let VERLAUF = null;  // portfolio_verlauf (7 Tage) fuer Graphen

function formatDeutsch(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const pad = n => (n+"").padStart(2,"0");
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// Letzten System-Log-Eintrag einer Quelle finden → HTML-Zeile "vor X · Text"
function letzteAenderung(quelle, maxLen) {
  maxLen = maxLen || 46;
  const sl = (savedData && savedData.system_log) || [];
  const e = sl.filter(x => x.quelle === quelle)
              .sort((a,b) => String(b.zeit||"").localeCompare(String(a.zeit||"")))[0];
  if (!e) return null;
  const farbe = e.level === 'error' ? '#ef4444' : e.level === 'warn' ? '#f59e0b' : '#10b981';
  const kurz = (e.text||'').length > maxLen ? (e.text||'').substring(0,maxLen)+'…' : (e.text||'');
  const t = e.zeit ? formatDeutsch(e.zeit).substring(11) : '';
  return `<div style="font-size:11px;color:var(--text-dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(e.text||'')}">⏱ ${t} <span style="color:${farbe}">${esc(kurz)}</span></div>`;
}

// ── NAVIGATION (8 Bereiche + Sub-Bereiche) ──
// Bereichs-Zuordnung: Panel-Name → Hauptbereich + Unterbereich
const AREA_MAP = {
  overview: { area: "overview" },
  alle:     { area: "portfolios", sub: "alle" },
  stocks:   { area: "portfolios", sub: "stocks" },
  etf:      { area: "portfolios", sub: "etf" },
  spec:     { area: "portfolios", sub: "spec" },
  charts:   { area: "maerkte" },
  analyse:  { area: "analyse", sub: "analyse" },
  analyse2: { area: "analyse", sub: "analyse2" },
  news:     { area: "aktivitaet" },
  ki:       { area: "ki" },
  log:      { area: "system" },
  settings: { area: "settings" },
};
const AREA_SUBS = {
  portfolios: [["alle","🗂️ Alle"],["stocks","📈 Aktien"],["etf","📦 ETF"],["spec","🔥 Spekulation"]],
  analyse:    [["analyse","📊 Analyse"],["analyse2","🗃️ Analyse DB"]],
};

// ─── PORTFOLIOS-ÜBERSICHT (Phase 6: ruhige Karten-Übersicht, max 6, Drawer-Detail) ───
const PF_FILTER = { kat: "alle", modus: "alle", risiko: "alle", status: "alle", suche: "", sort: "wert_desc" };

function pfKartenBauen(d) {
  let alle = [];
  (d.depots || []).forEach(x => alle.push({ ...x, _kat: "stocks" }));
  (d.etf_depots || []).forEach(x => alle.push({ ...x, _kat: "etf", ticker: x.ticker || ("ETF R" + x.risk) }));
  (d.spec_depots || []).forEach(x => alle.push({ ...x, _kat: "spec", ticker: x.ticker || ("SPEC R" + x.risk) }));
  return alle;
}

function renderPortfoliosUebersicht() {
  const d = window.__data; if (!d) return;
  const alle = pfKartenBauen(d);

  // Filter anwenden
  let liste = alle.filter(p => {
    if (PF_FILTER.kat !== "alle" && p._kat !== PF_FILTER.kat) return false;
    if (PF_FILTER.modus !== "alle" && (p.modus || "shadow") !== PF_FILTER.modus) return false;
    if (PF_FILTER.status === "aktiv" && (p.positionen || 0) <= 0) return false;
    if (PF_FILTER.status === "gesperrt" && !p.gesperrt) return false;
    if (PF_FILTER.status === "frei" && p.gesperrt) return false;
    if (PF_FILTER.risiko !== "alle") {
      const r = p.risk || 0;
      if (PF_FILTER.risiko === "niedrig" && r >= 34) return false;
      if (PF_FILTER.risiko === "mittel" && (r < 34 || r >= 67)) return false;
      if (PF_FILTER.risiko === "hoch" && r < 67) return false;
    }
    if (PF_FILTER.suche) {
      const q = PF_FILTER.suche.toLowerCase();
      if (!((p.ticker || "").toLowerCase().includes(q) || (p.name || "").toLowerCase().includes(q))) return false;
    }
    return true;
  });

  // Sortierung
  liste.sort((a, b) => {
    switch (PF_FILTER.sort) {
      case "wert_desc": return (b.wert || 0) - (a.wert || 0);
      case "wert_asc": return (a.wert || 0) - (b.wert || 0);
      case "rend_desc": return (b.rendite || 0) - (a.rendite || 0);
      case "rend_asc": return (a.rendite || 0) - (b.rendite || 0);
      case "risk_desc": return (b.risk || 0) - (a.risk || 0);
      case "risk_asc": return (a.risk || 0) - (b.risk || 0);
      default: return 0;
    }
  });

  const gesWert = alle.reduce((s, x) => s + (x.wert || 0), 0);
  const gesRend = alle.length ? alle.reduce((s, x) => s + (x.rendite || 0), 0) / alle.length : 0;
  const aktiv = alle.filter(x => (x.positionen || 0) > 0).length;
  const gesperrt = alle.filter(x => x.gesperrt).length;
  const maxKarten = 6;
  const karten = liste.slice(0, maxKarten);

  const opt = (v, l) => `<option value="${v}" ${PF_FILTER[v.split("_")[0]] === v || (v === "alle" && PF_FILTER[v] === "alle") ? "selected" : ""}>${l}</option>`;

  const kartenHtml = karten.length ? karten.map(p => {
    const typ = p._kat;
    const katLabel = { stocks: "📈 Aktien", etf: "📦 ETF", spec: "🔥 Spekulation" }[typ];
    const cls = (p.rendite || 0) > 0.5 ? "positive" : (p.rendite || 0) < -0.5 ? "negative" : "neutral";
    const modus = p.modus || "shadow";
    const modusBadge = modus === "paper" ? '<span class="badge badge-tech">PAPER</span>'
      : modus === "live" ? '<span class="badge badge-meme">LIVE</span>'
      : '<span class="badge badge-inverse">SHADOW</span>';
    const statusBadge = p.gesperrt ? '<span class="badge badge-meme">🔒 Gesperrt</span>'
      : (p.positionen || 0) > 0 ? '<span class="badge badge-tech">Aktiv</span>'
      : '<span class="badge badge-inverse">Leer</span>';
    return `<div class="card ${cls}" style="cursor:pointer" onclick="showDepot(${JSON.stringify(p).replace(/"/g, "&quot;")},'${typ}')">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <h3 style="margin:0">${esc(p.ticker || ("Risk " + p.risk))}</h3>
        <span style="font-size:10px;color:var(--text-muted)">${katLabel}</span>
      </div>
      <div class="wert">$${(p.wert || 0).toFixed(2)}</div>
      <div class="rendite ${cls === "positive" ? "positiv" : cls === "negative" ? "negativ" : ""}">${(p.rendite || 0) >= 0 ? "+" : ""}${(p.rendite || 0).toFixed(2)}%</div>
      <div class="meta">Risk ${p.risk || 0} · ${(p.positionen || 0)} Pos · ${(p.trades || 0)} Trades</div>
      <div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${modusBadge}${statusBadge}</div>
    </div>`;
  }).join("") : `<div class="glass" style="padding:24px;text-align:center;color:var(--text-muted)">Keine Portfolios entsprechen den gewählten Filtern.</div>`;

  const mehr = liste.length > maxKarten
    ? `<div style="text-align:center;margin-top:10px;font-size:12px;color:var(--text-muted)">${liste.length - maxKarten} weitere Portfolios — Filter anpassen oder Kategorie wählen.</div>` : "";

  document.getElementById("panel-alle").innerHTML = `
    <div class="summary-row" style="margin-bottom:12px">
      <div class="stat"><div class="num">$${gesWert.toFixed(0)}</div><div class="lbl">Gesamtwert</div></div>
      <div class="stat"><div class="num ${gesRend >= 0 ? "positiv" : "negativ"}">${gesRend >= 0 ? "+" : ""}${gesRend.toFixed(2)}%</div><div class="lbl">Ø Rendite</div></div>
      <div class="stat"><div class="num">${alle.length}</div><div class="lbl">Portfolios</div></div>
      <div class="stat"><div class="num">${aktiv}</div><div class="lbl">Aktiv</div></div>
      <div class="stat"><div class="num">${gesperrt}</div><div class="lbl">Gesperrt</div></div>
      <div class="stat"><div class="num" style="font-size:13px">SHADOW</div><div class="lbl">Modus</div></div>
    </div>
    <div class="surface" style="padding:14px;margin-bottom:14px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="text" placeholder="🔍 Suche Ticker…" value="${PF_FILTER.suche}" oninput="PF_FILTER.suche=this.value;renderPortfoliosUebersicht()" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;min-width:140px">
        <select onchange="PF_FILTER.kat=this.value;renderPortfoliosUebersicht()" style="padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit">

function showTab(name) {
  const map = AREA_MAP[name] || { area: name };
  // Haupt-Navigation
  document.querySelectorAll(".nav-item").forEach(t =>
    t.classList.toggle("active", t.dataset.area === map.area));
  // Sub-Navigation (nur bei Bereichen mit Unterbereichen)
  const subWrap = document.getElementById("subnavWrap");
  const subInner = document.getElementById("subnavInner");
  if (AREA_SUBS[map.area]) {
    const aktiverSub = (map.area === "portfolios" ? window._aktiverPortfolioSub : window._aktiverAnalyseSub) || name;
    subInner.innerHTML = AREA_SUBS[map.area].map(([key,label]) =>
      `<button class="subnav-item ${key === aktiverSub ? "active" : ""}" data-sub="${key}" onclick="showTab('${key}')">${label}</button>`).join("");
    subWrap.classList.add("active");
    if (map.area === "portfolios") window._aktiverPortfolioSub = aktiverSub;
    else window._aktiverAnalyseSub = aktiverSub;
  } else {
    subWrap.classList.remove("active");
    subInner.innerHTML = "";
  }
  // Panels
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  let panel = document.getElementById("panel-" + name);
  if (panel) panel.classList.add("active");
  if (name === "ki") kiSubTab(window._kiSubTab || "auswertung");
  if (name === "settings") renderSettings();

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ─── SVG-Line-Chart (leichtgewichtig, kein Chart.js) ─────────────
function svgLineChart(serie, opts) {
  // serie: [{zeit, wert, rendite?}], opts: {w, h, color, renditeFarbe}
  opts = opts || {};
  const W = opts.w || 560, H = opts.h || 120;
  const pts = serie || [];
  if (pts.length < 2) return `<div style="color:var(--text-dim);font-size:12px;padding:8px">Noch nicht genug Daten (${pts.length} Punkte)</div>`;
  const vals = pts.map(p => p.wert || 0);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = (maxV - minV) || 1;
  const pad = 2;
  // X/Y-Koordinaten
  const coords = pts.map((p, i) => {
    const x = pad + (i / (pts.length - 1)) * (W - 2 * pad);
    const y = pad + (1 - (p.wert - minV) / range) * (H - 2 * pad);
    return [x, y];
  });
  const line = coords.map((c, i) => (i === 0 ? "M" : "L") + c[0].toFixed(1) + "," + c[1].toFixed(1)).join(" ");
  const flaeche = line + " L" + (W - pad).toFixed(1) + "," + (H - pad).toFixed(1) + " L" + pad.toFixed(1) + "," + (H - pad).toFixed(1) + " Z";
  const color = opts.color || "#2563eb";
  // Letzter Wert + Rendite (Backend-rendite bevorzugen: gegen Startkapital)
  const last = pts[pts.length - 1];
  const rend = (last && typeof last.rendite === "number") ? last.rendite
    : (pts[0] && pts[0].wert ? ((last.wert / pts[0].wert - 1) * 100) : 0);
  const rendFarbe = rend >= 0 ? "var(--green)" : "var(--red)";
  // Zeit-Labels (Start/Mitte/Ende)
  const fmt = t => { const d = new Date(t.replace(" ", "T")); return d.getDate() + "." + (d.getMonth()+1) + ". " + d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0"); };
  return `<div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
      <span style="font-size:11px;color:var(--text-dim)">${fmt(pts[0].zeit)} → ${fmt(last.zeit)}</span>
      <span style="font-size:13px;font-weight:700;color:${rendFarbe}">${rend>=0?'+':''}${rend.toFixed(2)}% <span style="color:var(--text-dim);font-weight:400;font-size:11px">(${opts.label||"7 Tage"})</span></span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:${Math.max(28,H)}px;display:block">
      <defs>
        <linearGradient id="grad${opts.gid||"g"}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${flaeche}" fill="url(#grad${opts.gid||"g"})"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${coords[coords.length-1][0].toFixed(1)}" cy="${coords[coords.length-1][1].toFixed(1)}" r="3" fill="${color}"/>
    </svg>
  </div>`;
}

let _specSortDir = {};
function sortSpecWatch(field) {
  const body = document.getElementById("specWatchBody");
  if (!body) return;
  const dir = _specSortDir[field] === 'asc' ? 'desc' : 'asc';
  _specSortDir[field] = dir;
  const rows = Array.from(body.querySelectorAll("tr.spec-row"));
  rows.sort((a, b) => {
    const va = a.cells[['ticker','name','aktuell','tagesrendite','woche','volatilitaet','hebel','kategorie'].indexOf(field)]?.textContent || '';
    const vb = b.cells[['ticker','name','aktuell','tagesrendite','woche','volatilitaet','hebel','kategorie'].indexOf(field)]?.textContent || '';
    if (field === 'aktuell' || field === 'tagesrendite' || field === 'woche' || field === 'volatilitaet' || field === 'hebel') {
      return dir === 'asc' ? parseFloat(va) - parseFloat(vb) : parseFloat(vb) - parseFloat(va);
    }
    return dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  rows.forEach(r => body.appendChild(r));
  // Update sort indicator
  document.querySelectorAll("#specWatchTbl th.sortable").forEach(th => {
    th.textContent = th.textContent.replace(/[▴▾]/g,'').trim();
  });
  const thIdx = ['ticker','name','aktuell','tagesrendite','woche','volatilitaet','hebel','kategorie'].indexOf(field);
  if (thIdx >= 0) {
    const th = document.querySelectorAll("#specWatchTbl th.sortable")[thIdx];
    if (th) th.textContent = th.textContent.replace(/\s*$/, '') + (dir === 'asc' ? ' ▴' : ' ▾');
  }
}

function sectorBadge(s) {
  if (!s) return "";
  const c = s.toLowerCase().replace(/[^a-z]/g,'-').replace(/--+/g,'-').replace(/^-|-$/g,'');
  return `<span class="badge badge-${c}">${esc(s)}</span>`;
}

function pickBadge(name, sectors) {
  // Try to find badge from sector mapping, or pick best match from name
  const known = {
    'real estate':'realestate','utilities':'utilities','healthcare':'healthcare',
    'technology':'technology','financial services':'finance','energy':'energy',
    'consumer defensive':'consumer-defensive','consumer cyclical':'consumer-cyclical',
    'industrials':'industrials','basic materials':'basic-materials',
    'communication services':'communication','biotech':'biotech','crypto':'crypto',
    'meme':'meme','inverse':'inverse','volatility':'volatility','commodity':'commodity',
    'ai':'ai','ev':'ev','space':'space'
  };
  for (const s of sectors) {
    const low = s.toLowerCase();
    for (const [k,v] of Object.entries(known)) {
      if (low.includes(k)) return v;
    }
  }
  return 'technology';
}

function showDepot(dep, typ) {
  if (!dep || dep == null) return;
  openDrawer(dep.ticker || "Risk " + (dep.risk != null ? dep.risk : "?"), "Lade Detail-Daten…");

  const url = typ == "spec" ? `/spec_depot_json?ticker=${dep.ticker}`
            : typ == "etf" ? `/etf_depot_json?risk=${dep.risk}`
            : `/depot_json?risk=${dep.risk}`;
  fetch(url).then(r => r.json()).then(full => {
    dep.trades_raw = full.trades || [];
    dep.historie = full.historie || dep.historie || [];
    dep.wert = dep.wert || (full.bargeld || 0);
    dep.start = dep.start || full.start_wert || 100;
    dep.bargeld = full.bargeld || 0;

    const rend = dep.start > 0 ? ((dep.wert / dep.start) - 1) * 100 : 0;
    const pnl = (dep.wert || 0) - (dep.start || 100);
    const ki = full.ki_letzte || dep.ki_letzte;
    const kiIcon = ki ? (ki.aktion === 'kaufen' ? '🟢' : ki.aktion === 'verkaufen' ? '🔴' : '⚪') : '';

    let html = `
      <button class="back-btn" onclick="showTab('${typ === 'main' ? 'overview' : typ}')">← Zurück</button>
      <div class="detail-header">
        <h2>${typ == "spec" ? "🔥 " : typ == "etf" ? "📦 " : "📈 "}${label}</h2>
        <div class="sub">Start $${(dep.start||0).toFixed(2)} · Aktuell $${(dep.wert||0).toFixed(2)} · ${(dep.trades_raw||[]).length} Trades</div>
      </div>
      <div class="summary-row">
        <div class="stat"><div class="num ${rend >= 0 ? 'positiv' : 'negativ'}">${rend >= 0 ? '+' : ''}${rend.toFixed(2)}%</div><div class="lbl">Rendite</div></div>
        <div class="stat"><div class="num">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</div><div class="lbl">Gewinn/Verlust</div></div>
        <div class="stat"><div class="num">$${(dep.bargeld||0).toFixed(2)}</div><div class="lbl">Cash</div></div>
      </div>
      ${ki ? `<div class="glass" style="padding:8px 12px;margin-bottom:8px;border-left:3px solid ${ki.aktion === 'kaufen' ? 'var(--green)' : ki.aktion === 'verkaufen' ? 'var(--red)' : 'var(--orange)'}">
        <div style="display:flex;align-items:center;gap:8px;font-size:12px">
          <span style="font-size:16px">${kiIcon}</span>
          <div><b>KI-Entscheidung: ${ki.aktion.toUpperCase()}</b> (Konfidenz: ${ki.konfidenz}/100)</div>
        </div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:4px">${ki.grund || ''}</div>
      </div>` : ''}
      ${(() => {
        const tick = (dep.ticker || '').toUpperCase();
        const nb = (window.__data && window.__data.news_by_ticker) || {};
        const n = nb[tick];
        if (!n) return '';
        const [score, stars, topics] = n;
        const col = score >= 70 ? 'var(--green)' : score >= 45 ? 'var(--orange)' : 'var(--text-dim)';
        return `<div class="glass" style="padding:8px 12px;margin-bottom:8px;border-left:3px solid ${col}">
          <div style="display:flex;align-items:center;gap:8px;font-size:12px">
            <span style="font-size:16px">⚡</span>
            <div><b>News-Impact: ${score}/100 ${stars}</b> <span style="font-size:10px;color:var(--text-dim)">${(topics||[]).join(', ')}</span></div>
          </div>
          <div style="font-size:10px;color:var(--text-dim);margin-top:3px">Aktuelle KI-News-Bewertung für diesen Ticker</div>
        </div>`;
      })()}
      <div class="glass"><canvas id="detChartCanvas" height="140"></canvas></div>
      <div class="glass">
        <h3 style="margin-bottom:8px;font-size:13px;font-weight:500;color:var(--text-dim)">Positionen</h3>
        <table><tr><th>Ticker</th><th>Name</th><th>Shares</th><th>Ø Kauf</th><th>Wert</th></tr>
        ${(() => {
          const positions = dep.positions || (dep.shares > 0 ? [{ticker: dep.ticker, name: dep.name || dep.ticker, shares: dep.shares, avg_price: dep.avg_price}] : []);
          if (!positions.length || (positions.length == 1 && !positions[0].shares)) return "<tr><td colspan='5' style='color:var(--text-dim);padding:10px'>Keine offenen Positionen</td></tr>";
          return positions.map((p, i) => {
            const preis = p.avg_price || 0;
            const menge = p.shares || 0;
            const tick = p.ticker || dep.ticker;
            const nam = p.name || tick;
            // Extract sector from name (e.g. "[Healthcare]" at end)
            const secMatch = nam.match(/\[(.+?)\]/);
            const secName = secMatch ? secMatch[1] : '';
            return `<tr style="cursor:pointer" onclick="showTickerChart('${tick}','tchart_${i}','chartr_${i}')">

          return trades.map(t => {
            const ttyp = t.typ || t.aktion || "?";
            const farbe = ttyp == "kauf" || ttyp == "buy" || ttyp == "kaufen" ? "🟢" : "🔴";
            return `<tr><td>${t.zeit ? t.zeit.slice(0,16).replace("T"," ") : "-"}</td>
              <td>${farbe} ${ttyp}</td><td>${t.ticker || dep.ticker}</td>
              <td>${(t.menge || 0).toFixed(2)}</td><td>$${(t.preis || 0).toFixed(2)}</td>
              <td style="color:var(--text-dim)">${esc(t.grund || "")}</td></tr>`;
          }).join("");
        })()}
        </table></div>
      </div>`;
    document.getElementById("drawerBody").innerHTML = html;

    // CSS-Balken-Chart (statt Chart.js)
    const hist = dep.historie || [];
    if (hist.length > 1) {
      const maxWert = Math.max(...hist.map(h => h.wert));
      const minWert = Math.min(...hist.map(h => h.wert));
      const range = maxWert - minWert || 1;
      const startW = hist[0].wert;
      const endW = hist[hist.length-1].wert;
      const trendFarbe = endW >= startW ? '#22c55e' : '#ef4444';
      // Entferne ggf. altes Canvas
      const oldChart = document.getElementById("detChartCanvas");
      if (oldChart) {
        const parent = oldChart.parentNode;
        const cssChart = document.createElement("div");
        cssChart.id = "detCSSChart";
        cssChart.style.cssText = "height:100px;display:flex;align-items:flex-end;gap:2px;margin-top:6px";
        cssChart.innerHTML = hist.map(h => {
          const pct = ((h.wert - minWert) / range) * 100;
          return `<div style="flex:1;height:${Math.max(pct,2)}%;min-height:4px;background:${trendFarbe};border-radius:2px;opacity:0.7"></div>`;
        }).join('');
        parent.replaceChild(cssChart, oldChart);
      }
    }
  }).catch(err => {
    document.getElementById("drawerBody").innerHTML = `<div class="glass" style="color:var(--red)">Fehler: ${err.message}</div>`;
  });
}

// ─── Ticker-Chart ────────────────────────────────────────────
const _tickerCharts = {};

function showTickerChart(ticker, canvasId, rowId) {
  const row = document.getElementById(rowId);
  if (!row) return;
  if (row.style.display !== "none") {
    row.style.display = "none";
    return;
  }
  row.style.display = "table-row";
  row.innerHTML = `<td colspan="8" style="padding:6px">
    <div style="display:flex;align-items:center;gap:12px;font-size:11px">
      <b>${ticker}</b>
      <span id="${canvasId}_price" style="color:var(--text-dim)">Lade…</span>
    </div>
  </td>`;
  fetch(`/ticker_chart?ticker=${ticker}`)
    .then(r => r.json())
    .then(data => {
      if (!data.data || !data.data.length) {
        row.innerHTML = `<td colspan="8" style="color:var(--red);padding:10px">Keine Daten</td>`;
        return;
      }
      const el = document.getElementById(canvasId + "_price");
      if (!el) return;
      const current = data.data[data.data.length - 1];
      const first = data.data[0];
      const change = ((current - first) / first * 100).toFixed(1);
      const cls = change >= 0 ? "positiv" : "negativ";
      const min = Math.min(...data.data);
      const max = Math.max(...data.data);
      const range = max - min || 1;
      const dates = data.dates || [];
      el.innerHTML = `<span>$${current.toFixed(2)} <span class="${cls}">${change>=0?'+':''}${change}%</span></span>
        <span style="margin-left:12px;color:var(--text-dim)">${dates[0]||'?'} – ${dates[dates.length-1]||'?'}</span>
        <span style="display:inline-flex;align-items:flex-end;height:32px;gap:1px;margin-left:12px">
          ${data.data.map(v => {
            const pct = ((v - min) / range) * 100;
            return `<div style="width:4px;height:${Math.max(pct,2)}%;background:${change>=0?'#22c55e':'#ef4444'};border-radius:1px;opacity:0.7"></div>`;
          }).join('')}
        </span>`;
    })
    .catch(err => { row.innerHTML = `<td colspan="8" style="color:var(--red);padding:10px">Fehler: ${err.message}</td>`; });
}

// ─── Karten ──────────────────────────────────────────────────
function renderCard(dep, typ) {
  const cls = dep.rendite > 0.5 ? "positive" : dep.rendite < -0.5 ? "negative" : "neutral";
  const rend = dep.rendite != null ? dep.rendite : ((dep.wert || 0) / (dep.start || 100) - 1) * 100;
  const label = dep.ticker ? dep.ticker : "Risk " + dep.risk;
  const posNames = (dep.positions||[]).filter(p => p.shares).map(p => {
    // Extract clean name (strip [Sector] suffix for the hint line)
    const n = (p.name || p.ticker).replace(/\s*\[.*?\]/g, '');
    return n;
  });
  const nameHint = posNames.length ? posNames.join(" · ") : "";
  const wert = dep.wert || 0;
  const cash = dep.bargeld || 0;
  const pos = dep.positionen != null ? dep.positionen : (dep.shares > 0 ? 1 : 0);
  const trades = dep.trades || 0;
  const ki = dep.ki_letzte;
  const kiIcon = ki ? (ki.aktion === 'kaufen' ? '🟢' : ki.aktion === 'verkaufen' ? '🔴' : '⚪') : '';
  const kiTxt = ki ? `${kiIcon} KI: ${ki.aktion} (K:${ki.konfidenz})` : '';

  // Build sector badges from positions
  const posSectors = (dep.positions||[]).filter(p => p.shares).map(p => {
    const m = (p.name || '').match(/\[(.+?)\]/);
    return m ? m[1] : null;
  }).filter(Boolean);
  const badges = posSectors.slice(0,4).map(s => sectorBadge(s)).join('');

  return `<div class="card ${cls}" onclick="showDepot(${JSON.stringify(dep).replace(/\"/g,"&quot;")},'${typ}')">
    <h3>${label}</h3>
    ${badges ? `<div style="margin-bottom:3px">${badges}</div>` : ""}
    ${nameHint ? `<div style="font-size:10px;color:var(--text-dim);margin-bottom:4px;font-weight:400">${esc(nameHint)}</div>` : ""}
    <div class="wert">$${wert.toFixed(2)}</div>
    <div class="rendite ${rend >= 0 ? 'positiv' : 'negativ'}">${rend >= 0 ? '+' : ''}${rend.toFixed(2)}%</div>
    <div class="meta">${pos} Pos · $${cash.toFixed(0)} Cash · ${trades} Trades${dep.max_dd != null ? ' · MaxDD '+dep.max_dd.toFixed(1)+'%' : ''}${dep.gesperrt ? ' · 🔒' : ''}</div>
    ${kiTxt ? `<div style="font-size:10px;color:var(--text-dim);margin-top:2px">${kiTxt}</div>` : ''}
  </div>`;
}

// ── Zentrale Typ→Farbe (konsistent bei allen Kategorien) ──
function typStyle(typ) {
  const t = String(typ || '').toLowerCase();
  if (t.includes('kauf') || t === 'buy' || t.includes('long')) {
    return { color: 'var(--green)', bg: 'rgba(48,209,88,0.14)', icon: '🟢', label: 'KAUFEN' };
  }
  if (t.includes('verkauf') || t === 'sell' || t.includes('short')) {
    return { color: 'var(--red)', bg: 'rgba(255,69,58,0.14)', icon: '🔴', label: 'VERKAUFEN' };
  }
  if (t.includes('blockiert') || t.includes('blocked')) {
    return { color: 'var(--orange)', bg: 'rgba(255,159,10,0.14)', icon: '🛑', label: 'BLOCKIERT' };
  }
  return { color: 'var(--text-dim)', bg: 'rgba(142,142,147,0.14)', icon: '⚪', label: String(typ || '?').toUpperCase() };
}

function histTable(liste, limit) {
  if (!liste || !liste.length) return '<div style="color:var(--text-dim);font-size:12px">Keine Trades in diesem Zeitraum</div>';
  const rows = liste.slice(0, limit || 20).map(t => {
    const typ = t.typ || t.aktion || '?';
    const ts = typStyle(typ);
    const tag = `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.03em;color:${ts.color};background:${ts.bg}">${ts.icon} ${ts.label}</span>`;
    const menge = (t.menge || 0).toFixed(2);
    const preis = t.preis ? "$" + Number(t.preis).toFixed(2) : "-";
    return `<tr>
      <td style="white-space:nowrap">${t.zeit ? String(t.zeit).slice(0,16).replace("T"," ") : "-"}</td>
      <td><b>${esc(t.depot_label || "")}</b></td>
      <td>${tag}</td>
      <td><b>${esc(t.ticker || "")}</b></td>
      <td>${menge}</td>
      <td>${preis}</td>
      <td style="color:var(--text-dim);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.grund || "")}">${esc(t.grund || "")}</td>
    </tr>`;
  }).join('');
  return `<div style="max-height:260px;overflow-y:auto"><table style="font-size:11px"><tr>
    <th>Datum</th><th>Depot</th><th>Typ</th><th>Ticker</th><th>Menge</th><th>Preis</th><th>Grund</th>
  </tr>${rows}</table></div>`;
}

          </tr><tr id="specRow_${t}" style="display:none"><td colspan="8" style="padding:0"><canvas id="specChart_${t}" height="70"></canvas></td></tr>`;

async function load() {
  try {
    const r = await fetch(API);
    const d = await r.json();
    savedData = d;
    VERLAUF = d.portfolio_verlauf || null;
    window._tradeHistSpec = d.trade_hist_spec || [];
    window.__data = d;

    // ── Modus-Pill (Header) ──
    const mp = document.getElementById("modePill");
    if (mp) {
      const modus = (d.profil && d.profil.modus) || "SHADOW";
      const m = String(modus).toLowerCase();
      mp.textContent = "● " + modus;
      mp.className = "mode-pill " + (m === "paper" ? "paper" : m === "live" ? "live" : "shadow");
      mp.title = "Trading-Modus: " + modus + (d.paused && d.paused.paused ? " (pausiert)" : "");
    }

    const ut = document.getElementById("updateTime");
    if (ut) {
      const voll = formatDeutsch(d.aktualisiert) + " · " +
        d.depots.length + " Aktien · " + (d.etf_depots||[]).length + " ETF · " + d.spec_depots.length + " Spek";
      ut.textContent = (formatDeutsch(d.aktualisiert)||"").substring(0,5) + " · " + d.depots.length + "A/" + (d.etf_depots||[]).length + "E/" + d.spec_depots.length + "S";
      ut.title = voll;
    }
    // ── Version-Badge (aus version.json) ──
    try {
      const vr = await fetch("/api/version");
      const vd = await vr.json();
      const vb = document.getElementById("versionBadge");
      if (vb && vd.version) {
        vb.textContent = `v${vd.version}`;
        vb.title = `v${vd.version} · ${vd.released_at}${vd.codename ? ' · ' + vd.codename : ''}`;
      }
    } catch(e) {}

    // ── Kategorien ──
    const aktienTotal = d.depots.reduce((s,x) => s + x.wert, 0);
    const aktienInvest = d.depots.reduce((s,x) => s + x.start, 0);
    const aktienRendite = aktienInvest > 0 ? ((aktienTotal - aktienInvest) / aktienInvest * 100) : 0;
    const etfTotal = (d.etf_depots||[]).reduce((s,x) => s + x.wert, 0);
    const etfInvest = (d.etf_depots||[]).reduce((s,x) => s + x.start, 0);
    const etfRendite = etfInvest > 0 ? ((etfTotal - etfInvest) / etfInvest * 100) : 0;
    const specTotal = d.spec_depots.reduce((s,x) => s + x.wert, 0);
    const specInvest = d.spec_depots.reduce((s,x) => s + (x.start||0), 0);
    const specRendite = specInvest > 0 ? ((specTotal - specInvest) / specInvest * 100) : 0;
    const total = aktienTotal + etfTotal + specTotal;
    const totalInvest = aktienInvest + etfInvest + specInvest;
    const gesRendite = totalInvest > 0 ? ((total - totalInvest) / totalInvest * 100) : 0;

    // ── Market Status ──
    const mkEl = document.getElementById("marketStatus");
    if (mkEl) {
      const mk = d.markt_status || "unknown";
      const icons = {open: "🟢", pre: "🟡", closed: "🔴", unknown: "⚪"};
      const kurz = mk === "open" ? "offen" : mk === "pre" ? "pre" : mk === "closed" ? "zu" : "?";
      mkEl.innerHTML = `${icons[mk]||'⚪'} <b>${kurz}</b>`;
      mkEl.title = d.markt_label || '';
    }

    window._data = d;
    window._verfuegbareProfile = d.verfuegbare_profile || [];

    // ── Börsen-Chips (nur reale Börsen im Portfolio + Wert-Anteil) ──
    const boEl = document.getElementById("boersenDisplay");
    if (boEl) {
      const chips = d.boersen_chips || [];
      if (chips.length === 0) {
        boEl.innerHTML = "";
      } else {
        boEl.innerHTML = chips.map(c => {
          const dot = c.status === "open" ? "🟢" : "🔴";
          const tip = c.status === "open" ? "geöffnet" : (c.offen_text || "geschlossen");
          // Nächste Öffnung anzeigen (wenn geschlossen)
          const next = (c.status !== "open" && c.next_open && c.next_open !== "-")
            ? `<span style="opacity:.75"> · ⏰ ${c.next_open}</span>` : "";
          return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:6px;padding:1px 8px;border-radius:10px;background:rgba(255,255,255,0.08);font-size:10px;white-space:nowrap" title="${c.label}: ${tip}">
            ${dot} <b>${c.label}</b> ${c.anteil}%${next}</span>`;
        }).join('');
      }
    }

    // ── GLOBALES MAERKTE-HTML (v2.16.0) für Tab-Badges ──
    window._maerkteHtml = (d.boersen_chips || []).map(c => {
      const dot = c.status === 'open' ? '🟢' : '🔴';
      const tip = c.status === 'open' ? 'geöffnet' : (c.offen_text || 'geschlossen');
      const next = (c.status !== 'open' && c.next_open && c.next_open !== '-')
        ? ` <span style='opacity:.7'>· ⏰ ${c.next_open}</span>` : '';
      return `<span style='display:inline-flex;align-items:center;gap:3px;margin-right:5px;padding:1px 7px;border-radius:9px;background:rgba(255,255,255,0.08);font-size:10px;white-space:nowrap' title='${c.label}: ${tip}'>${dot} <b>${c.label}</b>${next}</span>`;
    }).join('');

    // ── Notifications ──
    const notifs = d.notifications || [];
    const badge = document.getElementById("notifBadge");
    if (badge) {
      badge.style.display = notifs.length ? "inline" : "none";
      if (notifs.length) badge.title = notifs.map(n => n.text).join(" | ");
    }

    // ── Drawdown-Warnung entfernt (v2.25.1: kein Mehrwert, Balken weg) ──

    // ── KI-Konfidenz-Verlauf (C) ──
    const kh = d.ki_konfidenz_history || [];
    let konfidenzHTML = "";
    if (kh.length >= 2) {
      const vals = kh.map(x => x.konfidenz);
      const min = Math.min(...vals, 0), max = Math.max(...vals, 100);
      const range = (max - min) || 1;
      const pts = kh.map((x, i) => {
        const xpos = (i / (kh.length - 1)) * 100;
        const ypos = 30 - ((x.konfidenz - min) / range) * 26 - 2;
        return `${xpos.toFixed(1)},${ypos.toFixed(1)}`;
      }).join(" ");
      const avg = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(0);
      konfidenzHTML = `<div class="glass" style="padding:8px 12px;margin-bottom:12px">
        <div style="font-size:13px;font-weight:600;margin-bottom:4px">🎯 KI-Konfidenz-Verlauf <span style="font-size:11px;color:var(--text-dim)">(Ø ${avg}%, letzte ${kh.length})</span></div>
        <svg viewBox="0 0 100 30" preserveAspectRatio="none" style="width:100%;height:34px">
          <polyline points="${pts}" fill="none" stroke="#8b5cf6" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>`;

            <div style="font-size:11px;color:var(--text-dim)">Skala -5 (widerlegt) … +5 (bestätigt)</div>
          </div>
          <div style="flex:1;min-width:150px;background:rgba(255,255,255,0.06);border-radius:12px;padding:10px;text-align:center">
            <div style="font-size:11px;color:var(--text-dim)">📌 Gewichtete Regeln</div>
            <div style="font-size:24px;font-weight:700;color:var(--accent)">${regeln.length}</div>
            <div style="font-size:11px;color:var(--text-dim)">aus KI-Lern-Bewertung</div>
          </div>
        </div>`;
        // Kategorien-Balken: Was wurde bestätigt/widerlegt?
        const kats = [
          {k:'success', label:'✅ Bestätigt', farbe:'#10b981'},
          {k:'teilsuccess', label:'🟡 Leicht bestätigt', farbe:'#84cc16'},
          {k:'neutral', label:'🧠 Neutral', farbe:'#94a3b8'},
          {k:'teilfehler', label:'🔻 Leicht widerlegt', farbe:'#f59e0b'},
          {k:'fehler', label:'❌ Widerlegt', farbe:'#ef4444'},
        ];
        const katCount = {};
        (d.ki_log||[]).forEach(e => {
          // Nur echte Lerneffekte zählen (lerneffekt als Zahl) — System-Notizen
          // (News-Lernschleife, Konfidenz, Exit, ki_bewertung) haben None
          if ((e.typ||'') === 'learned' && e.kategorie && typeof e.lerneffekt === 'number') {
            katCount[e.kategorie] = (katCount[e.kategorie]||0) + 1;
          }
        });
        const katMax = Math.max(...kats.map(k => katCount[k.k]||0), 1);
        statHtml += '<div style="font-size:12px;font-weight:600;margin:8px 0 4px">🧠 Lerneffekt-Verteilung</div>';
        statHtml += '<div style="margin-bottom:12px">' + kats.map(k => {
          const n = katCount[k.k]||0;
          const w = Math.max(n/katMax*100, n>0?4:0);
          return `<div style="display:flex;align-items:center;margin:3px 0;font-size:11px">
            <span style="width:120px">${k.label}</span>
            <div style="flex:1;height:14px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden">
              <div style="height:100%;width:${w}%;background:${k.farbe};border-radius:3px"></div>
            </div>
            <span style="width:36px;text-align:right;color:var(--text-dim)">${n}</span>
          </div>`;
        }).join('') + '</div>';
        // Verlauf: Lerneffekt der letzten 48h in Stunden-Buckets
        const buckets = {};
        (d.ki_log||[]).forEach(e => {
          if ((e.typ||'') === 'learned' && typeof e.lerneffekt === 'number' && e.zeit) {
            const d2 = new Date(e.zeit);
            const key = `${String(d2.getDate()).padStart(2,'0')}.${String(d2.getMonth()+1).padStart(2,'0')} ${String(d2.getHours()).padStart(2,'0')}:00`;
            if (!buckets[key]) buckets[key] = {sum:0, n:0};
            buckets[key].sum += e.lerneffekt; buckets[key].n++;
          }
        });
        const buckArr = Object.entries(buckets).sort((a,b)=>a[0].localeCompare(b[0])).slice(-24);
        if (buckArr.length >= 2) {
          const maxAbs = Math.max(...buckArr.map(b => Math.abs(b[1].sum/b[1].n)), 0.5);
          statHtml += '<div style="font-size:12px;font-weight:600;margin:8px 0 4px">📈 Lerneffekt-Verlauf (Ø pro Stunde)</div>';
          statHtml += '<div style="display:flex;align-items:flex-end;gap:3px;height:70px;margin-bottom:4px">' + buckArr.map(b => {
            const v = b[1].sum/b[1].n;
            const h = Math.abs(v)/maxAbs*60;
            const farbe = v >= 0.5 ? '#10b981' : v <= -0.5 ? '#ef4444' : '#94a3b8';
            return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%">
              <div style="height:${Math.max(h,3)}px;width:70%;background:${farbe};border-radius:2px;opacity:0.85" title="${b[0]}: ${v>=0?'+':''}${v.toFixed(2)}"></div>
              <div style="font-size:8px;color:var(--text-dim);margin-top:2px;transform:rotate(-45deg);white-space:nowrap">${b[0].substring(3)}</div>
            </div>`;
          }).join('') + '</div>';
        }
      } else {
        statHtml = '<div style="font-size:12px;color:var(--text-dim);padding:8px 0">Noch keine bewerteten Entscheidungen (lernt nach jedem Zyklus).</div>';
      }
      kiStatsEl.innerHTML = statHtml;
    }

    // ══════════════════════════════════════════════════════
    // 🤖 KI-OBERTAB: 🤖 Entscheidungen
    // ══════════════════════════════════════════════════════
    const kiDecEl = document.getElementById("kiDecBox");
    if (kiDecEl) {
      const decFilter = window._kiDecFilter || 'alle';
      let decRows = [...(d.ki_log||[])]
        .filter(e => (e.typ||'') === 'decision')
        .sort((a, b) => String(b.zeit || '').localeCompare(String(a.zeit || '')));
      if (decFilter !== 'alle') decRows = decRows.filter(e => (e.aktion||'') === decFilter);
      decRows = decRows.slice(0, 200);
      const decBtn = (key, label) =>
        `<button onclick="window._kiDecFilter='${key}';load()" style="margin-right:6px;padding:3px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:${(window._kiDecFilter||'alle')===key?'rgba(139,92,246,0.25)':'rgba(255,255,255,0.08)'};color:var(--text);cursor:pointer;font-size:11px">${label}</button>`;
      kiDecEl.innerHTML =
        '<div style="margin-bottom:8px">' + decBtn('alle','Alle') + decBtn('kaufen','🟢 kaufen') + decBtn('halten','⚪ halten') + decBtn('verkaufen','🔴 verkaufen') + `</div>` +
        `<div style="font-size:11px;color:var(--text-dim);margin-bottom:6px">${decRows.length} Entscheidungen</div>` +
        '<table class="ki-table"><thead><tr>' +
        '<th>Zeit</th><th>Ticker</th><th>Entscheidung</th><th>Regime</th><th>Sektor</th><th>Konf.</th><th>Lern</th><th>Begründung</th>' +
        '</tr></thead><tbody>' +
        decRows.map(e => {
          const icon = e.aktion === 'kaufen' ? '🟢' : e.aktion === 'verkaufen' ? '🔴' : '⚪';
          const regime = e.regime || '—';
          const sektor = e.sektor || '—';
          const kat = e.kategorie || '—';
          const lern = (typeof e.lerneffekt === 'number') ? (e.lerneffekt>=0?'+':'') + e.lerneffekt.toFixed(2) : '—';
          // Block 6: Shadow/Live-Flag — ki_log erfasst dies nicht (nur Regelwerk hat shadow).
          // Daher ehrlich: "n/a" statt falscher Aussage.
          const shadowFlag = '<span style="font-size:10px;color:#64748b">n/a</span>';
          return `<tr style="cursor:pointer" onclick="toggleKiDec('${e.ticker||''}_${(e.zeit||'').replace(/[^0-9]/g,'')}')">
            <td style="white-space:nowrap">${(e.zeit||'').substring(0,16).replace('T',' ')}</td>
            <td><b>${e.ticker||'?'}</b></td>
            <td>${icon} <b>${(e.aktion||'?').toUpperCase()}</b><br>${shadowFlag}</td>
            <td style="font-size:11px">${esc(regime)}</td>
            <td style="font-size:11px">${esc(sektor)}</td>
            <td>${e.konfidenz||'?'}</td>
            <td style="font-size:11px;color:${typeof e.lerneffekt==='number'?(e.lerneffekt>=0?'#10b981':'#ef4444'):'#64748b'}">${lern}</td>
            <td class="title-col" title="${esc(e.grund||'')}">${e.grund||''}</td>
          </tr>
          <tr id="kidec_${e.ticker||''}_${(e.zeit||'').replace(/[^0-9]/g,'')}" style="display:none">
            <td colspan="8" style="background:rgba(59,130,246,0.05);font-size:11px;padding:8px 10px">
              <b>🔍 Audit-Detail:</b>
              Ticker: <b>${e.ticker||'?'}</b> · Kategorie: ${esc(kat)} · Typ: ${esc(e.typ||'decision')}<br>
              Aktion: <b>${e.aktion||'?'}</b> · Konfidenz: ${e.konfidenz||'?'} · News-Score: ${e.news_score!=null?e.news_score:'—'}<br>
              Regime: ${esc(regime)} · Sektor: ${esc(sektor)} · 24h-Change: ${e.change_pct!=null?e.change_pct+'%':'—'}<br>
              Lerneffekt: ${lern} · Bezug: ${esc(e.bezug||'—')}<br>
              <span style="color:#64748b">Shadow/Live-Status: nicht im KI-Log erfasst (nur im Regelwerk via ki_decisions).</span>
            </td>
          </tr>`;
        }).join('') +
        '</tbody></table>';
    }

    // ══════════════════════════════════════════════════════
    // 🤖 KI-OBERTAB: 📰 News-Bewertung
    // ══════════════════════════════════════════════════════
    const kiNewsEl = document.getElementById("kiNewsBox");
    if (kiNewsEl) {
      let newsRows = [...(d.ki_log||[])]
        .filter(e => (e.typ||'') === 'news')
        .sort((a, b) => String(b.zeit || '').localeCompare(String(a.zeit || '')))
        .slice(0, 100);
      const scoreFarbe = s => s >= 75 ? '#10b981' : s >= 50 ? '#f59e0b' : '#ef4444';
      kiNewsEl.innerHTML =
        `<div style="font-size:11px;color:var(--text-dim);margin-bottom:6px">${newsRows.length} News-Bewertungen (neueste zuerst)</div>` +
        '<div style="max-height:600px;overflow-y:auto">' +
        newsRows.map(e => {
          const s = e.score||0;
          return `<div style="display:flex;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:12px;align-items:flex-start">
            <span style="min-width:44px;text-align:center;background:${scoreFarbe(s)}22;color:${scoreFarbe(s)};border-radius:8px;padding:2px 6px;font-weight:700">${s}${e.stars||''}</span>
            <div style="flex:1">
              <div>${esc(e.title||'')}${e.link ? ` <a href="${e.link}" target="_blank" style="color:var(--accent);text-decoration:none">🔗</a>` : ''}</div>
              <div style="font-size:11px;color:var(--text-dim);margin-top:2px">📅 ${(e.zeit||'').substring(0,16).replace('T',' ')} · 🎯 ${(e.tickers||[]).join(', ')||'—'} · ${esc(e.reason||e.grund||'')}</div>
            </div>
          </div>`;
        }).join('') +
        '</div>';
    }

    // ══════════════════════════════════════════════════════
    // 🤖 KI-OBERTAB: 🧠 Lerneffekte
    // ══════════════════════════════════════════════════════
    const kiLearnEl = document.getElementById("kiLearnBox");
    if (kiLearnEl) {
      const learnRows = [...(d.ki_log||[])]
        .filter(e => (e.typ||'') === 'learned' && e.kategorie !== 'confidence' && typeof e.lerneffekt === 'number')
        .sort((a, b) => String(b.zeit || '').localeCompare(String(a.zeit || '')))
        .slice(0, 200);
      const gruppen = [
        {k:'success', label:'✅ Bestätigt (Erfolge)', ikon:'✅', farbe:'#10b981'},
        {k:'teilsuccess', label:'🟡 Leicht bestätigt', ikon:'🟡', farbe:'#84cc16'},
        {k:'neutral', label:'🧠 Neutral (Rauschen)', ikon:'🧠', farbe:'#94a3b8'},
        {k:'teilfehler', label:'🔻 Leicht widerlegt', ikon:'🔻', farbe:'#f59e0b'},
        {k:'fehler', label:'❌ Widerlegt (Fehler)', ikon:'❌', farbe:'#ef4444'},
      ];
      let learnHtml = `<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px">${learnRows.length} bewertete Lerneffekte — was die KI aus ihren Entscheidungen gelernt hat</div>`;
      gruppen.forEach(g => {
        const rows = learnRows.filter(e => e.kategorie === g.k);
        if (!rows.length) return;
        learnHtml += `<div style="font-size:12px;font-weight:600;margin:10px 0 4px;color:${g.farbe}">${g.label} (${rows.length})</div>`;
        learnHtml += rows.map(e => {
          const le = e.lerneffekt;
          const leBadge = (typeof le === 'number')
            ? `<span style="background:${g.farbe}22;color:${g.farbe};padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700">${le >= 0 ? '+' : ''}${le}</span>`
            : '';
          return `<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px">
            <span style="white-space:nowrap;color:var(--text-dim)">${(e.zeit||'').substring(11,16)}</span>
            ${leBadge}
            <span style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600">${e.ticker ? (Array.isArray(e.ticker) ? e.ticker.join(', ') : e.ticker) : '?'}</span>
            <span class="title-col" title="${esc(e.notiz||'')}">${esc(e.notiz||'')}</span>
          </div>`;
        }).join('');
      });
      // ⚙️ System-Erkenntnisse (News-Lernschleife, Konfidenz-Kalibrierung, Exit-Qualität, KI-Bewertung)
      const sysRows = [...(d.ki_log||[])]
        .filter(e => (e.typ||'') === 'learned' && e.kategorie !== 'confidence' && typeof e.lerneffekt !== 'number')
        .sort((a, b) => String(b.zeit || '').localeCompare(String(a.zeit || '')))
        .slice(0, 25);
      if (sysRows.length) {
        learnHtml += `<div style="font-size:12px;font-weight:600;margin:10px 0 4px;color:#8b5cf6">⚙️ System-Erkenntnisse (${sysRows.length})</div>`;
        learnHtml += sysRows.map(e => {
          const pre = (e.notiz||'').includes('News') ? '📰' : (e.notiz||'').includes('Konfidenz') ? '🎯' : (e.notiz||'').includes('Exit') ? '💰' : '🤖';
          return `<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px">
            <span style="white-space:nowrap;color:var(--text-dim)">${(e.zeit||'').substring(11,16)}</span>
            <span>${pre}</span>
            <span class="title-col" title="${esc(e.notiz||'')}">${esc(e.notiz||'')}</span>
          </div>`;
        }).join('');
      }
      if (!learnRows.length && !sysRows.length) learnHtml += '<div style="font-size:12px;color:var(--text-dim);padding:8px 0">Noch keine Lerneffekte bewertet.</div>';
      kiLearnEl.innerHTML = learnHtml;
    }

    // ══════════════════════════════════════════════════════
    // 🤖 KI-OBERTAB: 📌 Regeln & Skill
    // ══════════════════════════════════════════════════════
    const kiRuleEl = document.getElementById("kiRuleBox");
    if (kiRuleEl) {
      // Block 6: Regelstand-Karte (Aggregat aus /data -> regelstand)
      const rs = d.regelstand || {};
      const rsCard =
        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding:10px 12px;background:rgba(59,130,246,0.06);border:1px solid rgba(59,130,246,0.18);border-radius:10px;font-size:12px">'
        + '<div style="font-weight:700;margin-right:4px">📊 Regelstand:</div>'
        + '<span style="background:#10b98122;color:#10b981;border-radius:8px;padding:3px 9px;font-weight:700">🟢 Freigegeben: ' + (rs.freigegeben||0) + '</span>'
        + '<span style="background:#f9731622;color:#f97316;border-radius:8px;padding:3px 9px;font-weight:700">🟠 Shadow: ' + (rs.shadow||0) + '</span>'
        + '<span style="background:#ef444422;color:#ef4444;border-radius:8px;padding:3px 9px;font-weight:700">🔴 Archiviert: ' + (rs.archiviert||0) + '</span>'
        + '<span style="background:#64748b22;color:#64748b;border-radius:8px;padding:3px 9px;font-weight:700">Aktiv: ' + (rs.aktiv||0) + '</span>'
        + '<span style="background:#3b82f622;color:#3b82f6;border-radius:8px;padding:3px 9px;font-weight:700">✓ OOS: ' + (rs.oos_bestätigt||0) + '</span>'
        + '<span style="background:rgba(100,116,139,0.1);color:var(--text-dim);border-radius:8px;padding:3px 9px">Letzter Sync: ' + (rs.letzter_sync||"—") + '</span>'
        + '</div>';
      const regeln = [...(d.ki_regeln||[])].sort((a,b) => (b.gewicht||0)-(a.gewicht||0));
      let ruleHtml = rsCard + '<div style="font-size:12px;font-weight:600;margin-bottom:6px">📌 Gelernte Regeln (fließen in KI-Prompts)</div>';
      // Prio 3: Konfidenz-Cap Banner
      if (d.konfidenz_cap != null) {
        ruleHtml += `<div style="background:#f59e0b22;color:#f59e0b;border-radius:8px;padding:6px 10px;font-size:11px;margin-bottom:8px;font-weight:600">🎯 Konfidenz-Cap aktiv: KI darf max. ${d.konfidenz_cap}% angeben (überschätzt sich in hohen Bereichen)</div>`;
      }
      if (regeln.length) {
        ruleHtml += '<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px">Je höher das Gewicht, desto stärker beeinflusst die Regel künftige Entscheidungen. ⚠-Regeln sind Verbote (systematisch widerlegte Muster).</div>';
        ruleHtml += regeln.map(r => {
          const g = r.gewicht || 1;
          const anti = (r.muster||'').startsWith('[Anti]');
          const meta = (r.muster||'').startsWith('[Meta]');
          const stern = anti ? '' : (g >= 1.5 ? '⭐⭐' : g >= 1.0 ? '⭐' : '');
          const farbe = anti ? '#ef4444' : meta ? '#8b5cf6' : (g >= 1.5 ? '#10b981' : g >= 1.0 ? '#f59e0b' : '#94a3b8');
          // Prio 2: Lebenszyklus-Status
          const status = r.status || 'stabil';
          const statusInfo = {
            'stabil':   { t: 'stabil',     c: '#10b981' },
            'wackelig': { t: 'wackelig',   c: '#f59e0b' },
            'veraltet': { t: 'veraltet',   c: '#ef4444' },
          }[status] || { t: status, c: '#94a3b8' };
          const konfliktBadge = r.konflikt
            ? '<span style="background:#ef444422;color:#ef4444;border-radius:6px;padding:2px 6px;font-weight:700;font-size:10px;margin-left:6px">⚠ Konflikt</span>'
            : '';
          const metaBadge = meta
            ? '<span style="background:#8b5cf622;color:#8b5cf6;border-radius:6px;padding:2px 6px;font-weight:700;font-size:10px;margin-left:6px">🎯 Meta</span>'
            : '';
          const statusBadge = `<span style="background:${statusInfo.c}22;color:${statusInfo.c};border-radius:6px;padding:2px 6px;font-weight:700;font-size:10px;margin-left:6px">${statusInfo.t}</span>`;
          let govBadge = '';
          if (r.shadow) govBadge = '<span style="background:#f9731622;color:#f97316;border-radius:6px;padding:2px 6px;font-weight:700;font-size:10px;margin-left:6px">🟠 Shadow</span>';
          else if (r.freigabe_status === 'freigegeben') govBadge = '<span style="background:#10b98122;color:#10b981;border-radius:6px;padding:2px 6px;font-weight:700;font-size:10px;margin-left:6px">🟢 Freigegeben</span>';
          else if (r.freigabe_status === 'nicht_freigegeben') govBadge = '<span style="background:#64748b22;color:#64748b;border-radius:6px;padding:2px 6px;font-weight:700;font-size:10px;margin-left:6px">⚪ Nicht freigegeben</span>';
          if (r.archiviert) govBadge += '<span style="background:#ef444422;color:#ef4444;border-radius:6px;padding:2px 6px;font-weight:700;font-size:10px;margin-left:6px">🔴 Archiviert</span>';
          const oosBadge = r.oos_confirmed ? '<span style="background:#3b82f622;color:#3b82f6;border-radius:6px;padding:2px 6px;font-weight:700;font-size:10px;margin-left:6px">✓ OOS</span>' : '<span style="background:#64748b22;color:#64748b;border-radius:6px;padding:2px 6px;font-weight:700;font-size:10px;margin-left:6px">? OOS offen</span>';
          return `<div style="display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:12px;padding:6px 8px;background:rgba(255,255,255,0.04);border-radius:8px${r.konflikt?';border:1px solid #ef444455':''}">
            <span style="min-width:${anti?'88px':'64px'};text-align:center;background:${farbe}22;color:${farbe};border-radius:6px;padding:2px 6px;font-weight:700;white-space:nowrap">${anti?'⚠ NICHT':meta?'🎯 Meta':'G '+g+stern}</span>
            <span>${esc(r.muster||'')} → <b>${esc(r.regel||'')}</b>${metaBadge}${konfliktBadge}${statusBadge}${govBadge}${oosBadge}</span>
          </div>`;
        }).join('');
      } else {
        ruleHtml += '<div style="font-size:12px;color:var(--text-dim);padding:8px 0">Noch keine Regeln gelernt.</div>';
      }
      // Prio 2: Konflikt-Banner
      const konflikte = d.regel_konflikte || [];
      if (konflikte.length) {
        ruleHtml += '<div style="margin:12px 0 6px;padding:10px 12px;background:#ef444422;border:1px solid #ef444455;border-radius:10px;font-size:12px">'
          + '<div style="font-weight:700;color:#ef4444;margin-bottom:6px">⚠ Regel-Konflikte (' + konflikte.length + ')</div>'
          + konflikte.map(k =>
              `<div style="color:var(--text);margin:4px 0">• <b>${esc(k.a)}</b> vs. <b>${esc(k.b)}</b><br>`
            + `<span style="color:var(--text-dim);font-size:11px">${esc(k.befund)}</span></div>`
          ).join('')
          + '</div>';
      }
      const fam = d.ki_regel_familien || [];
      if (fam.length) {
        ruleHtml += '<div style="font-size:12px;font-weight:600;margin:14px 0 6px">📊 Regel-Trefferquoten (7 Tage)</div>';
        ruleHtml += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px">' +
          fam.map(f => {
            const q = f.quote;
            const farbe = q >= 50 ? '#10b981' : q >= 30 ? '#f59e0b' : '#ef4444';
            return `<div style="padding:8px 10px;background:rgba(255,255,255,0.04);border-radius:8px;font-size:11px">
              <div style="font-weight:600;margin-bottom:3px">${esc(f.familie||'')} <span style="color:${farbe};font-weight:700">${q}%</span></div>
              <div style="color:var(--text-dim)">${f.pos}✓ / ${f.neg}✗ von ${f.ges} Lerneffekten</div>
            </div>`;
          }).join('') + '</div>';
      }
      const hist = d.regel_history || [];
      if (hist.length >= 2) {
        // Ø-Gewicht pro Snapshot (nur positive Regeln für Trend-Sichtbarkeit)
        const avgWeights = hist.map(h => {
          const pos = h.regeln.filter(r => !r.anti && r.gewicht > 0);
          const avg = pos.length ? pos.reduce((s,r)=>s+r.gewicht,0)/pos.length : 0;
          return avg;
        });
        const nAnti = hist[hist.length-1].regeln.filter(r => r.anti).length;
        const min = Math.min(...avgWeights, 0), max = Math.max(...avgWeights, 2);
        const range = (max - min) || 1;
        const pts = avgWeights.map((w,i) => {
          const xpos = (i/(avgWeights.length-1))*100;
          const ypos = 30 - ((w-min)/range)*26 - 2;
          return `${xpos.toFixed(1)},${ypos.toFixed(1)}`;
        }).join(' ');
        ruleHtml += `
          <div style="font-size:12px;font-weight:600;margin:14px 0 6px">📈 Regel-Evolution (Ø-Gewicht der positiven Regeln)</div>
          <div class="glass" style="padding:8px 12px">
            <svg viewBox="0 0 100 30" preserveAspectRatio="none" style="width:100%;height:34px">
              <polyline points="${pts}" fill="none" stroke="#10b981" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
            </svg>
            <div style="font-size:10px;color:var(--text-dim);margin-top:3px">${hist.length} Snapshots · aktuell ${nAnti} Anti-Regeln (Verbote) · steigende Linie = KI traut sich mehr</div>
          </div>`;
      }
      ruleHtml += `
        <div style="margin-top:14px;padding:10px 12px;background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.25);border-radius:10px;font-size:12px">

          <div style="color:var(--text-dim)">Die <b>${Math.min(regeln.length,5)}</b> stärksten Regeln werden bei jedem Cron-Lauf in den Hermes-Skill <code style="background:rgba(255,255,255,0.1);padding:1px 5px;border-radius:4px">ki-trading-learning-loop</code> übernommen (<code style="background:rgba(255,255,255,0.1);padding:1px 5px;border-radius:4px">references/aktuelle-ki-regeln.md</code>). Damit verbessern sich künftige Entscheidungen und die Hermes-Skills automatisch mit jedem Lernzyklus.</div>
        </div>`;
      ruleHtml += `
        <div style="margin-top:10px;padding:10px 12px;background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.2);border-radius:10px;font-size:12px">

          <div style="color:var(--text-dim)">1. Trader treffen Entscheidungen → 2. Kursentwicklung wird gemessen (Skala −5…+5) → 3. KI bewertet das <i>Warum</i> → 4. Bestätigte Muster werden Regeln mit Gewicht → 5. Regeln fließen in die nächsten KI-Prompts + den Hermes-Skill. Jeder Zyklus verstärkt, was funktioniert (≥0.5% Bewegung) und schwächt, was nicht funktioniert.</div>
        </div>`;
      kiRuleEl.innerHTML = ruleHtml;
    }

    // ══════════════════════════════════════════════════════
    // 📚 WAS DIE KI LERNT (erklärender Subtab + Live-Daten)

    if (lernErkEl) {

      // ── 1. Die 7 Lern-Mechanismen (statisch erklärt) ──

        ["💰 Swap-Regeln", "Misst Opportunitätskosten: Liefen 'halten'-Positionen schlechter als Benchmark (SPY/Cash)? → Umschichtungs-Regel mit Typ (inner_portfolio/benchmark/cash_reserve)."],

      // ── 3. Live: Regel-Status ──

      const anzAnti = regeln.filter(r => r.typ === 'anti').length;

      const anzStabil = regeln.filter(r => r.status === 'stabil').length;
      html += `<div style="font-size:12px;font-weight:600;margin-bottom:6px">📊 Regel-Status (live)</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <span style="padding:4px 10px;background:rgba(16,185,129,0.12);border-radius:8px;font-size:12px">✅ stabil: <b>${anzStabil}</b></span>
          <span style="padding:4px 10px;background:rgba(16,185,129,0.1);border-radius:8px;font-size:12px">🟢 positiv: <b>${anzPositiv}</b></span>
