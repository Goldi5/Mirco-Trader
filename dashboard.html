          <span style="padding:4px 10px;background:rgba(139,92,246,0.1);border-radius:8px;font-size:12px">🟣 swap: <b>${anzSwap}</b></span>

        logEl.innerHTML =
          '<div style="font-size:12px;font-weight:600;margin-bottom:6px">System-Log (neueste zuerst)</div>' +

    // ── Settings-Tab (nur bei Bedarf rendern) ──
    if (document.getElementById("panel-settings")?.classList.contains("active")) {
      renderSettings();
    }

  } catch(e) {
    document.getElementById("panel-overview").innerHTML = '<div class="glass" style="padding:20px;color:#dc2626">Fehler: ' + e.message + '</div>';
  }
}

function cssBar(titel, trades, rendite, topTicker, grundStats) {
  const top = (topTicker||[]).slice(0, 6);
  const gruende = (grundStats||{});
  const grundArr = Object.entries(gruende).slice(0, 6);
  return `<div class="glass" style="margin-bottom:10px;padding:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="font-size:14px;font-weight:600;margin:0">${titel}</h3>
      <span style="font-size:12px;color:var(--text-dim)">${trades} Trades · ${rendite.toFixed(2)}% Rendite</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div>
        <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px">Meistgehandelte Ticker</div>
        ${top.map(t => {
          const maxTrades = Math.max(...top.map(x=>x[1].trades), 1);
          const w = (t[1].trades / maxTrades * 100).toFixed(0);
          return `<div style="display:flex;align-items:center;margin:2px 0;font-size:11px">
            <span style="width:60px;font-weight:500">${t[0]}</span>
            <div style="height:14px;width:${w}%;background:var(--accent);border-radius:3px;min-width:4px"></div>
            <span style="margin-left:6px;color:var(--text-dim)">${t[1].trades}</span>
          </div>`;
        }).join('')}
      </div>
      <div>
        <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px">Trades nach Grund</div>
        ${grundArr.map(([g, n]) => {
          const maxG = Math.max(...grundArr.map(x=>x[1]), 1);
          const w = (n / maxG * 100).toFixed(0);
          return `<div style="display:flex;align-items:center;margin:2px 0;font-size:11px">
            <span style="width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${g}</span>
            <div style="height:14px;width:${w}%;background:#a78bfa;border-radius:3px;min-width:4px"></div>
            <span style="margin-left:6px;color:var(--text-dim)">${n}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

// ⚙️ EINSTELLUNGEN (KI + Lernen + Bremsen + News) mit Risikowarnung

let settingsMeta = null;  // {settings, limits, bools} vom GET

async function ladeSettingsMeta() {
  if (settingsMeta) return settingsMeta;
  const r = await fetch("/api/settings");
  settingsMeta = await r.json();
  return settingsMeta;
}

function settingsInput(pfad, wert, meta) {
  const lim = meta.limits[pfad] || {};
  const min = lim.min ?? 0, max = lim.max ?? 100;
  const empMin = lim.emp_min, empMax = lim.emp_max;
  const einheit = lim.einheit || "";
  const outOfRange = (empMin !== null && wert < empMin) || (empMax !== null && wert > empMax);
  const warnStyle = outOfRange ? "border-color:#f59e0b;background:rgba(245,158,11,0.1)" : "";
  const lbl = meta.labels[pfad] || {name: pfad.split(".").pop(), desc: ""};
  return `<div class="setting-row" style="display:flex;align-items:center;gap:14px;padding:9px 4px;border-bottom:1px solid var(--card-border)">
    <div style="flex:1;min-width:0">
      <label style="font-size:12.5px;color:var(--text);font-weight:600">${lbl.name} ${einheit?`<span style="color:var(--text-dim);font-weight:400">(${einheit})</span>`:''} ${outOfRange?'⚠️':''}</label>
      ${lbl.desc?`<div style="font-size:10.5px;color:var(--text-dim);margin-top:1px;line-height:1.35">${lbl.desc}</div>`:''}
      ${empMin!==null?`<div style="font-size:9.5px;color:var(--text-dim);margin-top:1px">⚖ Empfohlen: ${empMin}–${empMax}${einheit}</div>`:''}
    </div>
    <div style="width:130px;flex-shrink:0;text-align:right">
      <input type="number" step="0.01" min="${min}" max="${max}"
        data-pfad="${pfad}" value="${wert}"
        style="width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--card-border);
               background:#fff;color:var(--text);font-size:12.5px;text-align:right;${warnStyle}"
        oninput="markSettingsDirty()" />
    </div>
  </div>`;
}

function settingsBool(pfad, wert, meta) {
  const label = (meta.labels[pfad] && meta.labels[pfad].name) || meta.bools[pfad] || pfad;
  const desc = (meta.labels[pfad] && meta.labels[pfad].desc) || "";
  return `<div class="setting-row" style="display:flex;align-items:center;gap:14px;padding:9px 4px;border-bottom:1px solid var(--card-border)">
    <div style="flex:1;min-width:0">
      <label style="font-size:12.5px;color:var(--text);font-weight:600">${label}</label>
      ${desc?`<div style="font-size:10.5px;color:var(--text-dim);margin-top:1px;line-height:1.35">${desc}</div>`:''}
    </div>
    <div style="flex-shrink:0">
      <label style="display:inline-flex;align-items:center;cursor:pointer;gap:8px">
        <input type="checkbox" data-pfad="${pfad}" ${wert? 'checked':''}
          onchange="markSettingsDirty()" style="width:17px;height:17px;accent-color:var(--accent)" />
        <span style="font-size:11px;color:var(--text-dim)">${wert?'An':'Aus'}</span>
      </label>
    </div>
  </div>`;
}

function markSettingsDirty() {
  const b = document.getElementById("settingsSaveBtn");
  if (b) { b.style.background = "#f59e0b"; b.textContent = "💾 Speichern *"; }
}

async function renderSettings() {
  const box = document.getElementById("settingsBox");
  if (!box) return;
  const meta = await ladeSettingsMeta();
  const s = meta.settings;
  // Ist der aktuelle User Admin? (für Benutzer-Tab)
  let binAdmin = false;
  try {
    const mr = await fetch("/api/me");
    const mj = await mr.json();
    binAdmin = mj.ok && isAdminRole(mj.role);
  } catch (e) { binAdmin = false; }
  const tabIds = settingsTabOrder().filter(t => t !== "benutzer" || binAdmin);
  box.innerHTML = `
    <h2 style="margin:0 0 4px">⚙️ Einstellungen</h2>
    <p style="font-size:11px;color:var(--text-dim);margin:0 0 12px">
      Werte außerhalb des empfohlenen Bereichs → ⚠️ Risikowarnung (Bestätigung nötig). Harte Grenzen blockieren.
    </p>

    <div class="settings-tabs" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
      ${tabIds.map((t,i)=>
        `<button class="stab ${i===0?'active':''}" data-stab="${t}"
          onclick="switchSettingsTab('${t}')"
          style="padding:6px 14px;border-radius:999px;border:1px solid rgba(15,23,42,.07);
                 background:${i===0?'var(--accent)':'rgba(118,118,128,.10)'};color:${i===0?'#fff':'var(--text)'};
                 cursor:pointer;font-size:12px;font-weight:600;transition:all .18s">${SETTINGS_TABS[t]}</button>`).join('')}
    </div>

    <div id="settingsPanel">
      ${tabIds.map(t => t === "konto" ? renderKontoTab() : t === "benutzer" ? '<div class="settings-tab-panel" data-stab="benutzer" style="display:none" id="benutzerPanel"></div>' : renderSettingsTab(t, s, meta)).join('')}
    </div>

    <div id="settingsWarn" style="margin-top:12px"></div>
    <div style="margin-top:14px;display:flex;gap:10px">
      <button id="settingsSaveBtn" onclick="saveSettings(false)"
        style="padding:10px 20px;border-radius:999px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent-dark));
               color:#fff;cursor:pointer;font-weight:600;transition:all .18s">💾 Speichern</button>
      <button onclick="resetSettings()"
        style="padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);
               background:transparent;color:var(--text);cursor:pointer">↺ Reset Defaults</button>
    </div>
  `;
  if (binAdmin) ladeBenutzerVerwaltung();
  ladeKontoDaten();
  ladeTenantScope();
  switchSettingsTab("konto");  // nur "Mein Konto" sichtbar beim ersten Öffnen
}

// PHASE 10+11: Tenant-Scoped Risikogrenzen + Regeln laden (nur Tenant-Admin)
async function ladeTenantScope() {
  try {
    const me = await (await fetch("/api/me")).json();
    const role = me.effective_role || me.role;
    if (!["tenant_admin","admin","superadmin"].includes(role)) return;
    const p = document.getElementById("tenantScopePanel");
    if (p) p.style.display = "block";
    // Risiko
    const rm = await (await fetch("/api/risk?mode=moderate")).json();
    const ra = await (await fetch("/api/risk?mode=aggressive")).json();
    let html = `<div style="font-weight:600;margin:4px 0 6px">🎚️ Risikogrenzen (effektiv)</div>`;
    html += riskRow("Moderat", rm.limits) + riskRow("Aggressiv", ra.limits);
    html += `<div style="margin-top:6px"><button onclick="riskModal()" style="padding:6px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-size:11px;font-weight:600">✏️ Grenzen bearbeiten</button></div>`;
    // Regeln
    const rl = await (await fetch("/api/rules")).json();
    html += `<div style="font-weight:600;margin:12px 0 6px">📜 Regeln (effektiv, Tenant ⊇ Global)</div>`;
    const tenantRules = (rl.rules||[]).filter(r=>r.source==="tenant");
    const globalCount = (rl.rules||[]).length - tenantRules.length;
    html += `<div style="font-size:11px;margin-bottom:6px">${tenantRules.length} tenant-eigene · ${globalCount} global geerbt</div>`;
    html += `<div style="max-height:180px;overflow:auto">` +
      (rl.rules||[]).slice(0,20).map(r=>`<div style="padding:4px 0;border-bottom:1px solid rgba(15,23,42,.05);font-size:11px">
        <span style="display:inline-block;width:54px;font-size:9px;border-radius:4px;padding:1px 4px;background:${r.source==='tenant'?'rgba(37,99,235,.12)':'rgba(118,118,128,.12)'};color:${r.source==='tenant'?'var(--accent)':'var(--text-dim)'}">${r.source}</span>
        <b>${esc(r.id)}</b> <span style="color:var(--text-dim)">${(r.status||'aktiv')}</span><br>
        <span style="color:var(--text-dim)">${esc(String(r.regel||'').slice(0,80))}</span></div>`).join('') +
      `</div>`;
    const body = document.getElementById("tenantScopeBody");
    if (body) body.innerHTML = html;
  } catch(e) { /* still */ }
}

function riskRow(label, lim) {
  if (!lim) return "";
  return `<div style="padding:3px 0;font-size:11px">${label}: Pos ${fmtPct(lim.position_size)} · SL ${fmtPct(lim.stop_loss)} · TP ${fmtPct(lim.take_profit)} · DD ${fmtPct(lim.drawdown_limit)} <span style="color:var(--text-dim)">(${lim.source})</span></div>`;
}
function fmtPct(v){ return v==null?'–':(parseFloat(v)*100).toFixed(0)+'%'; }

function riskModal() {
  const ps = prompt("Position-Size (0-1, leer=unverändert):", "");
  if (ps===null) return;
  const sl = prompt("Stop-Loss (0-1):", "");
  const tp = prompt("Take-Profit (0-1):", "");
  const dd = prompt("Drawdown-Limit (0-1):", "");
  const fd = new FormData();
  if (ps) fd.append("position_size", ps);
  if (sl) fd.append("stop_loss", sl);
  if (tp) fd.append("take_profit", tp);
  if (dd) fd.append("drawdown_limit", dd);
  fetch("/api/risk/set", {method:"POST", body: fd}).then(()=>ladeTenantScope());
}

async function mfaAktion(aktion) {
  const code = document.getElementById("mfaCode")?.value || "";
  try {
    const r = await fetch("/api/me/mfa", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({aktion, code})});

    if (j.ok) {
      msg("mfaMsg", aktion === "deaktivieren" ? "MFA deaktiviert ✅" : "MFA aktiviert ✅", "ok");

async function createUser() {
  const name = document.getElementById("nuName")?.value.trim() || "";
  const pw = document.getElementById("nuPw")?.value || "";
  const role = document.getElementById("nuRole")?.value || "user";
  try {
    const r = await fetch("/api/users/create", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({username:name, password:pw, role})});
    const j = await r.json();
    if (j.ok) { msg("nuMsg", `Benutzer '${name}' angelegt ✅`, "ok"); document.getElementById("nuName").value=""; document.getElementById("nuPw").value=""; ladeBenutzerVerwaltung(); }
    else msg("nuMsg", j.error, "bad");
  } catch(e) { console.warn(e); }
}

async function setUserRole(name, role) {
  try {
    const r = await fetch(`/api/users/${encodeURIComponent(name)}/role`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({role})});
    const j = await r.json();
    if (!j.ok) alert("Fehler: " + (j.error||"unbekannt"));
  } catch(e) { console.warn(e); }
}

async function toggleUser(name, active) {
  try {
    const r = await fetch(`/api/users/${encodeURIComponent(name)}/deactivate`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({active})});
    const j = await r.json();
    if (j.ok) ladeBenutzerVerwaltung(); else alert("Fehler: " + (j.error||"unbekannt"));
  } catch(e) { console.warn(e); }
}

async function resetUserPw(name) {
  const neu = prompt(`Neues Passwort für ${name} (min. 8 Zeichen):`);
  if (!neu) return;
  try {
    const r = await fetch(`/api/users/${encodeURIComponent(name)}/reset-pw`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({password:neu})});
    const j = await r.json();
    if (j.ok) alert("Passwort zurückgesetzt ✅"); else alert("Fehler: " + (j.error||"unbekannt"));
  } catch(e) { console.warn(e); }
}

async function revokeUser(name) {
  if (!confirm(`Alle Sessions von '${name}' beenden?`)) return;
  try {
    const r = await fetch(`/api/users/${encodeURIComponent(name)}/revoke`, {method:"POST"});
    const j = await r.json();
    if (j.ok) { alert("Sessions beendet ✅"); ladeBenutzerVerwaltung(); }
  } catch(e) { console.warn(e); }
}

function renderSettingsTab(tab, s, meta) {
  const list = (...html) => `<div style="display:flex;flex-direction:column">${html.join('')}</div>`;
  const intro = TAB_INTRO[tab] ? `<p style="font-size:11px;color:var(--text-dim);margin:0 0 12px;line-height:1.4">${TAB_INTRO[tab]}</p>` : "";
  let body = "";
  if (tab === "ki") {
    body = list(
      settingsInput("ki.konfidenz_cap", s.ki.konfidenz_cap, meta),
      settingsInput("ki.ki_temperatur", s.ki.ki_temperatur, meta),
      settingsInput("ki.min_konfidenz_kaufen", s.ki.min_konfidenz_kaufen, meta),
      settingsInput("ki.exit_score_schwelle", s.ki.exit_score_schwelle, meta),
      settingsInput("ki.news_swap_min_score", s.ki.news_swap_min_score, meta),
      settingsBool("ki.news_swap_aktiv", s.ki.news_swap_aktiv, meta),
      `<div style="grid-column:1/-1">${settingsBool("ki.multi_timeframe_lernen", s.ki.multi_timeframe_lernen, meta)}</div>`
    );
  } else if (tab === "lernen") {
    body = list(
      settingsInput("lernen.decay_lambda", s.lernen.decay_lambda, meta),
      settingsInput("lernen.anti_min_n", s.lernen.anti_min_n, meta),
      settingsInput("lernen.anti_min_widerlegt_pct", s.lernen.anti_min_widerlegt_pct, meta),
      settingsInput("lernen.max_regeln", s.lernen.max_regeln, meta),
      `<div style="grid-column:1/-1;display:flex;align-items:center;gap:8px">
         <label style="font-size:12px;color:var(--text)">Lern-Modus:</label>
         <select data-pfad="lernen.lern_modus" onchange="markSettingsDirty()"
           style="padding:5px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);
                  background:rgba(255,255,255,0.06);color:var(--text)">
           ${["auto","deterministisch","pausiert"].map(m=>`<option ${s.lernen.lern_modus===m?'selected':''}>${m}</option>`).join('')}
         </select>
       </div>`
    );
  } else if (tab === "kapital") {
    body = list(
      settingsInput("kapital.gesamt_budget", s.kapital.gesamt_budget, meta),
      settingsInput("kapital.max_gesamt_drawdown", s.kapital.max_gesamt_drawdown, meta),
      settingsInput("kapital.aktien_anteil", s.kapital.aktien_anteil, meta),
      settingsInput("kapital.etf_anteil", s.kapital.etf_anteil, meta),
      settingsInput("kapital.spec_anteil", s.kapital.spec_anteil, meta),
      `<div style="font-size:11px;color:var(--text-dim);grid-column:1/-1">Summe Aktien+ETF+Spec: ${s.kapital.aktien_anteil+s.kapital.etf_anteil+s.kapital.spec_anteil}% ${s.kapital.aktien_anteil+s.kapital.etf_anteil+s.kapital.spec_anteil!==100?'⚠️ ≠ 100%':''}</div>`
    );
  } else if (tab === "depot") {
    body = list(
      settingsInput("depot_struktur.aktien_stufen", s.depot_struktur.aktien_stufen, meta),
      settingsInput("depot_struktur.aktien_schritt", s.depot_struktur.aktien_schritt, meta),
      settingsInput("depot_struktur.max_spec_depots", s.depot_struktur.max_spec_depots, meta),
      `<div style="grid-column:1/-1;display:flex;align-items:center;gap:8px">
         <label style="font-size:12px;color:var(--text)">Aktive ETF-Stufen:</label>
         <select multiple data-pfad="depot_struktur.etf_stufen_aktiv" onchange="markSettingsDirty()"
           style="padding:5px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);
                  background:rgba(255,255,255,0.06);color:var(--text);min-height:80px;flex:1">
           ${["Geldmarkt","Anleihen","Markt","Sektor","Thema","Gehebelt"].map(st=>
             `<option ${s.depot_struktur.etf_stufen_aktiv.includes(st)?'selected':''}>${st}</option>`).join('')}
         </select>
       </div>`
    );
  } else if (tab === "risk") {
    body = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 20px">
      <div style="font-size:11px;color:var(--text-dim);grid-column:1/-1;font-weight:600">Moderat</div>
      ${settingsInput("risk_parameter.moderate_position_size", s.risk_parameter.moderate_position_size, meta)}
      ${settingsInput("risk_parameter.moderate_stop_loss", s.risk_parameter.moderate_stop_loss, meta)}
      ${settingsInput("risk_parameter.moderate_take_profit", s.risk_parameter.moderate_take_profit, meta)}
      <div></div>
      <div style="font-size:11px;color:var(--text-dim);grid-column:1/-1;font-weight:600;margin-top:8px">Aggressiv</div>
      ${settingsInput("risk_parameter.aggressive_position_size", s.risk_parameter.aggressive_position_size, meta)}
      ${settingsInput("risk_parameter.aggressive_stop_loss", s.risk_parameter.aggressive_stop_loss, meta)}
      ${settingsInput("risk_parameter.aggressive_take_profit", s.risk_parameter.aggressive_take_profit, meta)}
    </div>`;
  } else if (tab === "bremsen") {
    body = list(
      settingsInput("engine_bremsen.max_depot_pro_ticker", s.engine_bremsen.max_depot_pro_ticker, meta),
      settingsInput("engine_bremsen.drawdown_sperre_prozent", s.engine_bremsen.drawdown_sperre_prozent, meta),
      settingsBool("engine_bremsen.wochenende_handel", s.engine_bremsen.wochenende_handel, meta)
    );
  } else if (tab === "news") {
    body = list(
      settingsInput("news.news_min_score", s.news.news_min_score, meta),
      settingsInput("news.news_max_alter_std", s.news.news_max_alter_std, meta)
    );
  }
  const display = "none";  // alle Panels starten versteckt; switchSettingsTab zeigt das aktive
  return `<div class="settings-tab-panel" data-stab="${tab}" style="display:${display}">
    <div class="glass" style="padding:14px">${intro}${body}</div>
  </div>`;
}

async function saveSettings(bestaetigt) {
  const box = document.getElementById("settingsBox");
  const inputs = box.querySelectorAll("[data-pfad]");
  const neue = { ki:{}, lernen:{}, engine_bremsen:{}, news:{}, kapital:{}, depot_struktur:{}, risk_parameter:{} };
  inputs.forEach(el => {
    const pfad = el.dataset.pfad;
    const [bereich, feld] = pfad.split(".");
    let val;
    if (el.type === "checkbox") val = el.checked;
    else if (el.tagName === "SELECT" && el.multiple) {
      val = Array.from(el.selectedOptions).map(o => o.value);
    }
    else if (el.tagName === "SELECT") val = el.value;
    else val = parseFloat(el.value);
    neue[bereich][feld] = val;
  });

  const r = await fetch("/api/settings", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({settings: neue, bestaetigt: bestaetigt})
  });
  const res = await r.json();

  if (res.warnung) {
    // Risikowarnung → Bestätigungs-Dialog
    const ok = confirm("⚠️ RISIKOWARNUNG:\n\n" + res.warnungen.join("\n\n") +
                       "\n\nTrotzdem speichern?");
    if (ok) { await saveSettings(true); }
    return;
  }
  if (res.ok) {
    document.getElementById("settingsSaveBtn").style.background = "var(--accent)";
    document.getElementById("settingsSaveBtn").textContent = "💾 Speichern";
    settingsMeta = null;  // Cache invalidieren
    alert("✅ " + res.meldung);
  } else {
    alert("❌ " + res.meldung);
  }
}

async function resetSettings() {
  if (!confirm("Alle Einstellungen auf Defaults zurücksetzen?")) return;
  const defaults = {
    ki: {"konfidenz_cap":60,"ki_temperatur":0.1,"min_konfidenz_kaufen":60,
         "exit_score_schwelle":70,"news_swap_aktiv":true,"news_swap_min_score":75,
         "multi_timeframe_lernen":true},
    lernen: {"decay_lambda":0.01,"anti_min_n":5,"anti_min_widerlegt_pct":60,
             "max_regeln":40,"lern_modus":"auto"},
    engine_bremsen: {"max_depot_pro_ticker":4,"drawdown_sperre_prozent":30,
                     "wochenende_handel":false},
    news: {"news_min_score":20,"news_max_alter_std":48},
    kapital: {"gesamt_budget":10000,"aktien_anteil":40,"etf_anteil":30,
              "spec_anteil":30,"max_gesamt_drawdown":25},
    depot_struktur: {"aktien_stufen":20,"aktien_schritt":5,"max_spec_depots":48,
                     "etf_stufen_aktiv":["Geldmarkt","Anleihen","Markt","Sektor","Thema","Gehebelt"]},
    risk_parameter: {"moderate_position_size":0.35,"moderate_stop_loss":0.92,
                     "moderate_take_profit":1.12,"aggressive_position_size":0.50,
                     "aggressive_stop_loss":0.85,"aggressive_take_profit":1.20}
  };
  const r = await fetch("/api/settings", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({settings: defaults, bestaetigt: true})
  });
  const res = await r.json();
  if (res.ok) { settingsMeta = null; renderSettings(); alert("✅ Reset erfolgreich"); }
  else alert("❌ " + res.meldung);
}

// Block 6: Audit-Detail ein/ausklappen
function toggleKiDec(id) {
  const el = document.getElementById('kidec_' + id);
  if (!el) return;
  el.style.display = (el.style.display === 'none') ? 'table-row' : 'none';
}


function togglePause() {
  const p = (window._data && window._data.paused && window._data.paused.paused) || false;
  const next = p ? 'off' : 'on';
  const grund = p ? '' : 'manuell (Dashboard)';
  if (!p && !confirm('Handel wirklich pausieren?\nScheduler startet keine Pipeline mehr, bis du ihn wieder aktivierst.')) return;
  fetch('/api/pause_trading?state=' + next + '&grund=' + encodeURIComponent(grund))
    .then(r => r.json())
    .then(j => {
      if (j.ok) { load(); }
      else { alert('Fehler: ' + (j.error||'unbekannt')); }
    })
    .catch(e => alert('Netzwerk-Fehler: ' + e.message));
}

function wechselProfil(name) {
  if (!name) return;
  if (!confirm('Profil wirklich wechseln zu: ' + name + '?\\n(Trading-Logik nutzt das Profil ab naechstem Scheduler-Lauf)')) {
    load(); return;  // zuruecksetzen
  }
  fetch('/api/profile?set=' + encodeURIComponent(name))
    .then(r => r.json())
    .then(j => { if (j.ok) load(); else alert('Fehler: ' + (j.error||'?')); })
    .catch(e => alert('Netzwerk: ' + e.message));
}

// ─── Phase 11 (§18): Profil-/Markt-Karten ───
function ladeProfilKarten() {
  fetch('/api/profil_karten')
    .then(r => r.json())
    .then(j => {
      if (!j.ok) return;
      const container = document.getElementById('profil-karten');
      if (!container) return;
      container.innerHTML = '';
      j.karten.forEach(k => {
        const shadow = k.status === 'shadow';
        const badge = shadow ? '👁️ SHADOW' : '🟢 LIVE';
        const card = document.createElement('div');
        card.className = 'profil-karte' + (shadow ? ' shadow' : ' live');
        card.innerHTML = `
          <div class="pk-markt">${k.markt}</div>
          <div class="pk-name">${k.name}</div>
          <div class="pk-badge">${badge}</div>
          <div class="pk-info">${k.depotarten.join(' · ')}</div>
          <div class="pk-info">${k.base_currency} · ${k.regelstand_ref}</div>
        `;
        container.appendChild(card);
      });
      // PDF/Archiv als Chips in derselben Zeile wie die Profil-Karten (gleiche Struktur = gleiche Größe)
      const act = document.createElement('div');
      act.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap';
      act.innerHTML = `
        <button class="profil-karte" style="text-align:left;color:var(--text);font-family:inherit;font-weight:400;cursor:pointer;transition:all .18s;border-left:3px solid var(--accent);display:flex;flex-direction:column;justify-content:center" onmouseover="this.style.background='var(--card-hover)'" onmouseout="this.style.background='var(--card-bg)'" onclick="erstellePDF()" title="PDF-Bericht erstellen">
          <div class="pk-markt">📄 Aktion</div>
          <div class="pk-name">PDF-Bericht</div>
          <div class="pk-badge" style="color:var(--accent)">erstellen</div>
          <div class="pk-info">Vollständiger Report</div>
        </button>
        <button class="profil-karte" style="text-align:left;color:var(--text);font-family:inherit;font-weight:400;cursor:pointer;transition:all .18s;border-left:3px solid var(--accent);display:flex;flex-direction:column;justify-content:center" onmouseover="this.style.background='var(--card-hover)'" onmouseout="this.style.background='var(--card-bg)'" onclick="zeigeReportListe()" title="Archiv öffnen">
          <div class="pk-markt">📚 Aktion</div>
          <div class="pk-name">Archiv</div>
          <div class="pk-badge" style="color:var(--accent)">öffnen</div>
          <div class="pk-info">Gespeicherte Berichte</div>
        </button>`;
      container.appendChild(act);
    })
    .catch(e => console.warn('Profil-Karten Fehler:', e));
}

// Beim Laden + alle 60s
document.addEventListener('DOMContentLoaded', () => {
  ladeProfilKarten();
  setInterval(ladeProfilKarten, 60000);
});

// ─── Phase 10 (§17): PDF-Report manuell ───
function erstellePDF() {
  const btn = event.target.closest('button');
  const nameEl = btn.querySelector('.pk-name');
  const setBtn = (txt) => { if (nameEl) nameEl.textContent = txt; };
  btn.disabled = true;
  setBtn('⏳ Erstelle...');
  fetch('/api/report_pdf')
    .then(r => r.json())
    .then(j => {
      if (j.ok) {
        window.open(j.url, '_blank');
        setBtn('✅ Erstellt');
      } else {
        alert('Fehler: ' + (j.error || 'unbekannt'));
        setBtn('PDF-Bericht');
      }
      setTimeout(() => { btn.disabled = false; setBtn('PDF-Bericht'); }, 2000);
    })
    .catch(e => { alert('Netzwerk: ' + e.message); btn.disabled = false; setBtn('PDF-Bericht'); });
}

function zeigeReportListe() {
  const container = document.getElementById('report-liste');
  if (container.style.display === 'none') {
    fetch('/api/report_list')
      .then(r => r.json())
      .then(j => {
        if (!j.ok || !j.reports.length) { container.innerHTML = '<p style="font-size:12px;color:var(--text-dim)">Keine Berichte im Archiv.</p>'; container.style.display = 'block'; return; }
        container.innerHTML = '<div style="font-size:13px;font-weight:600;margin-bottom:6px">📚 Archiv</div>' +
          j.reports.map(r => `<a href="${r.url}" target="_blank" style="display:block;padding:6px 10px;font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--card-border);border-radius:8px;margin-bottom:4px">${r.name} · ${r.datum}</a>`).join('');
        container.style.display = 'block';
      })
      .catch(e => console.warn('Report-Liste Fehler:', e));
  } else {
    container.style.display = 'none';
  }
}
// ── Analyse2-Tab: eigenständige DB-Abfrage ──
function anLaden2() {
  const mode = document.getElementById("an2Mode").value;
  const typ = document.getElementById("an2Typ").value;
  const ticker = document.getElementById("an2Ticker").value.trim();
  const aktion = document.getElementById("an2Aktion").value;
  const provider = document.getElementById("an2Provider").value;
  const fallback = document.getElementById("an2Fallback").value;
  const tage = document.getElementById("an2Tage").value;
  const order = document.getElementById("an2Order").value;
  const p = new URLSearchParams({ mode: mode, tage: tage, order: order, limit: 500 });
  if (typ) p.set("typ", typ);
  if (ticker) p.set("ticker", ticker);
  if (aktion) p.set("aktion", aktion);
  if (provider) p.set("provider", provider);
  if (fallback) p.set("fallback", fallback);
  document.getElementById("an2Count").textContent = "lädt...";
  fetch("/api/db_query?" + p.toString())
    .then(r => r.json())
    .then(d => {
      if (d.error) { document.getElementById("an2Count").textContent = "Fehler: " + d.error; return; }
      const rows = d.rows || [];
      document.getElementById("an2Count").textContent = rows.length + " Eintraege";
      const body = document.getElementById("an2Body");
      body.innerHTML = "";
      rows.forEach(r => {
        const tr = document.createElement("tr");
        tr.style.borderBottom = "1px solid rgba(255,255,255,0.08)";
        const farbe = (r.aktion === "kaufen") ? "#34d399" : (r.aktion === "verkaufen") ? "#f87171" : "#fbbf24";
        const fb = r.fallback === "True" ? " ⚠FB" : "";
        tr.innerHTML = "<td style='padding:5px'>" + esc((r.zeit||"").replace("T"," ").slice(0,19)) + "</td>"
          + "<td style='padding:5px'>" + esc(r.depot_typ||"") + "</td>"
          + "<td style='padding:5px;font-weight:bold'>" + esc(r.ticker||"") + "</td>"
          + "<td style='padding:5px;color:" + farbe + "'>" + esc(r.aktion||"") + fb + "</td>"
          + "<td style='padding:5px;text-align:right'>" + (r.menge!=null?r.menge:"") + "</td>"
          + "<td style='padding:5px;text-align:right'>" + (r.preis!=null?r.preis:"") + "</td>"
          + "<td style='padding:5px;opacity:0.8'>" + esc((r.grund||"").slice(0,80)) + "</td>"
          + "<td style='padding:5px;text-align:right'>" + (r.konfidenz!=null?r.konfidenz:(r.confidence!=null?r.confidence:"")) + "</td>"
          + "<td style='padding:5px;opacity:0.6'>" + esc(r.provider||"") + "</td>"
          + "<td style='padding:5px;opacity:0.6'>" + esc((r.decision_id||"").slice(0,18)) + "</td>"
          + "<td style='padding:5px;opacity:0.6'>" + esc(r.regel_id||"") + "</td>";
        body.appendChild(tr);
      });
    })
    .catch(e => { document.getElementById("an2Count").textContent = "Fehler: " + e.message; });
  // Analyse-Karten laden
  fetch("/api/db_karten?tage=" + tage)
    .then(r => r.json())
    .then(d => {
      const k = d.karten || {};
      const kvh = k.kauf_verkauf_halte || {};
      const prov = k.provider_verteilung || {};
      const prov_str = Object.entries(prov).map(([p,n])=>p+":"+n).join(", ") || "n/a";
      const cards = [
        ["Trades (Zeitraum)", k.trades_zeitraum],
        ["KI-Entscheidungen", k.ki_entscheidungen],
        ["Kauf/Verkauf/Halten", (kvh.kauf||0)+" / "+(kvh.verkauf||0)+" / "+(kvh.halten||0)],
        ["Konfidenz-Schnitt", k.konfidenz_schnitt!=null ? k.konfidenz_schnitt+"%" : "n/a"],
        ["mit decision_id", k.entscheidungen_mit_decision_id],
        ["mit Regel-ID", k.entscheidungen_mit_regel],
        ["Fallback (⚠)", k.legacy_fallbacks],
        ["Provider unbekannt", k.provider_fehler],
        ["Provider-Verteilung", prov_str],
      ];
      const box = document.getElementById("an2Karten");
      box.innerHTML = "";
      cards.forEach(c => {
        const div = document.createElement("div");
        div.style.cssText = "background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:8px 12px;min-width:120px";
        div.innerHTML = "<div style='font-size:11px;opacity:0.7'>" + esc(c[0]) + "</div><div style='font-size:15px;font-weight:600'>" + esc(String(c[1])) + "</div>";
        box.appendChild(div);
      });
    })
    .catch(e => { console.warn("Karten-Fehler:", e.message); });
}
