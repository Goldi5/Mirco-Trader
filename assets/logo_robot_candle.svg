<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Micro-Trader Logo Motiv 2: Roboter + Candlestick -->
  <rect width="120" height="120" rx="24" fill="#FFFFFF"/>
  <!-- Roboter-Kopf -->
  <rect x="34" y="26" width="52" height="40" rx="12" fill="#0A84FF"/>
  <!-- Augen -->
  <circle cx="50" cy="44" r="6" fill="#FFFFFF"/>
  <circle cx="70" cy="44" r="6" fill="#30D158"/>
  <!-- Antenne -->
  <line x1="60" y1="26" x2="60" y2="14" stroke="#0A84FF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="60" cy="12" r="5" fill="#30D158"/>
  <!-- Candlesticks (Chart-Körper) -->
  <g stroke-linecap="round">
    <line x1="40" y1="78" x2="40" y2="94" stroke="#0A84FF" stroke-width="3"/>
    <rect x="35" y="84" width="10" height="6" fill="#0A84FF"/>
    <line x1="60" y1="74" x2="60" y2="98" stroke="#30D158" stroke-width="3"/>
    <rect x="55" y="80" width="10" height="10" fill="#30D158"/>
    <line x1="80" y1="82" x2="80" y2="96" stroke="#0A84FF" stroke-width="3"/>
    <rect x="75" y="86" width="10" height="6" fill="#0A84FF"/>
  </g>
</svg>
