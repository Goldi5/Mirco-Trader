<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Micro-Trader Logo Motiv 3: Neural-Triangle -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#FFFFFF"/>
  <!-- Aufwärts-Dreieck aus 3 Candlesticks -->
  <g stroke="url(#grad)" stroke-width="6" stroke-linecap="round">
    <line x1="36" y1="92" x2="36" y2="78" />
    <rect x="31" y="80" width="10" height="10" fill="url(#grad)" stroke="none"/>
    <line x1="60" y1="70" x2="60" y2="50" />
    <rect x="55" y="54" width="10" height="14" fill="url(#grad)" stroke="none"/>
    <line x1="84" y1="92" x2="84" y2="64" />
    <rect x="79" y="66" width="10" height="20" fill="url(#grad)" stroke="none"/>
  </g>
  <!-- Verbindungslinien (Neural) -->
  <g stroke="#0A84FF" stroke-width="2" opacity="0.6" fill="none">
    <path d="M41 82 L60 56 L89 74"/>
    <path d="M41 82 L89 74"/>
  </g>
  <!-- AI-Knoten oben -->
  <circle cx="60" cy="34" r="8" fill="url(#grad)"/>
  <circle cx="60" cy="34" r="3" fill="#FFFFFF"/>
