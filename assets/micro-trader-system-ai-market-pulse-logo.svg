<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Micro Trader System — AI Market Pulse</title>
  <desc id="desc">Logo with three connected AI nodes flowing into an upward market curve.</desc>
  <defs>
    <linearGradient id="pulse" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#20d9ff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1200" rx="180" fill="#111827"/>
  <g fill="none" stroke="url(#pulse)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M250 470 L430 350 L590 470 L820 270 L970 390" stroke-width="22" opacity=".32"/>
    <path d="M250 470 L430 350 L590 470 L820 270 L970 390" stroke-width="9"/>
  </g>
  <g fill="#111827" stroke="url(#pulse)" stroke-width="10">
    <circle cx="250" cy="470" r="34"/>
    <circle cx="430" cy="350" r="34"/>
    <circle cx="590" cy="470" r="34"/>
  </g>
  <path d="M820 270 L820 225 L875 270" fill="none" stroke="#73e6b0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="760" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="5">MICRO TRADER</text>
  <text x="600" y="835" text-anchor="middle" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="400" letter-spacing="8">SYSTEM</text>
  <text x="600" y="930" text-anchor="middle" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="4">KI GENERIERT</text>
</svg>